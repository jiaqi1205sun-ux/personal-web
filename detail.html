    <style>
      body {
        font-family: "Noto Sans SC", sans-serif;
        background-color: #fdf2f8;
        color: #831843;
        scroll-behavior: smooth;
        image-rendering: pixelated;
      }

      .font-pixel {
        font-family: "Press Start 2P", "ZCOOL KuaiLe", cursive;
      }
      .font-zh-pixel {
        font-family: "ZCOOL KuaiLe", "Press Start 2P", cursive;
      }

      .pixel-card {
        background: white;
        border: 4px solid #831843;
        box-shadow: 6px 6px 0px 0px #ec4899;
        transition: all 0.2s ease;
        image-rendering: pixelated;
      }
      .pixel-card:hover {
        transform: translate(-3px, -3px);
        box-shadow: 9px 9px 0px 0px #f472b6;
      }

      .pixel-tag {
        display: inline-block;
        background: #fbcfe8;
        color: #be185d;
        border: 2px solid #be185d;
        padding: 4px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        image-rendering: pixelated;
        box-shadow: 2px 2px 0px 0px #be185d;
      }

      .pixel-btn {
        position: relative;
        display: inline-block;
        background: #ec4899;
        color: white;
        border: none;
        cursor: pointer;
        image-rendering: pixelated;
        transition: transform 0.1s;
        box-shadow:
          inset -4px -4px 0px 0px rgba(0, 0, 0, 0.2),
          4px 4px 0px 0px #831843;
      }
      .pixel-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow:
          inset -4px -4px 0px 0px rgba(0, 0, 0, 0.2),
          6px 6px 0px 0px #831843;
      }
      .pixel-btn:active {
        transform: translate(2px, 2px);
        box-shadow:
          inset -4px -4px 0px 0px rgba(0, 0, 0, 0.2),
          2px 2px 0px 0px #831843;
      }

      .pixel-btn-outline {
        position: relative;
        display: inline-block;
        background: transparent;
        color: #ec4899;
        border: 4px solid #ec4899;
        cursor: pointer;
        image-rendering: pixelated;
        transition: transform 0.1s;
        box-shadow: 4px 4px 0px 0px #ec4899;
      }
      .pixel-btn-outline:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px 0px #ec4899;
        background: rgba(236, 72, 153, 0.1);
      }
      .pixel-btn-outline:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px 0px #ec4899;
      }

      .pixel-nav {
        background: #fdf2f8;
        border-bottom: 4px solid #831843;
        image-rendering: pixelated;
      }

      .pixel-menu {
        background: #fdf2f8;
        border: 4px solid #831843;
        box-shadow: 6px 6px 0px 0px #ec4899;
      }

      .pixel-box {
        background: white;
        border: 3px solid #831843;
        box-shadow: 4px 4px 0px 0px #ec4899;
        padding: 16px;
      }

      .pixel-divider {
        height: 8px;
        background: repeating-linear-gradient(
          90deg,
          #ec4899 0px,
          #ec4899 8px,
          transparent 8px,
          transparent 16px
        );
      }

      .pixel-bg {
        background-image:
          radial-gradient(circle, #f9a8d4 2px, transparent 2px),
          radial-gradient(circle, #fbcfe8 2px, transparent 2px);
        background-size: 32px 32px;
        background-position:
          0 0,
          16px 16px;
      }

      .fade-in {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }
      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }

      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf2f8;
        border-left: 3px solid #831843;
      }
      ::-webkit-scrollbar-thumb {
        background: #ec4899;
        border: 3px solid #831843;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f472b6;
      }

      .article-content h1 {
        font-family: "ZCOOL KuaiLe", "Press Start 2P", cursive;
        font-size: 1.5rem;
        font-weight: 700;
        color: #831843;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }

      .article-content h2 {
        font-family: "ZCOOL KuaiLe", "Press Start 2P", cursive;
        font-size: 1.25rem;
        font-weight: 700;
        color: #9d174d;
        margin-top: 1.75rem;
        margin-bottom: 0.75rem;
      }

      .article-content h3 {
        font-family: "ZCOOL KuaiLe", "Press Start 2P", cursive;
        font-size: 1.125rem;
        font-weight: 700;
        color: #be185d;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
      }

      .article-content p {
        color: #831843;
        line-height: 1.8;
        margin-bottom: 1rem;
      }

      .article-content ul,
      .article-content ol {
        margin-left: 1.5rem;
        margin-bottom: 1rem;
      }

      .article-content li {
        color: #831843;
        line-height: 1.8;
        margin-bottom: 0.5rem;
      }

      .article-content strong {
        color: #831843;
        font-weight: 700;
      }

      .article-content .ml-8 {
        margin-left: 2rem;
      }

      .article-content .text-gray-700 {
        color: #9d174d;
      }

      .article-content .font-bold {
        font-weight: 700;
      }

      .article-content .mr-2 {
        margin-right: 0.5rem;
      }

      .article-content .mb-1 {
        margin-bottom: 0.25rem;
      }

      .article-content br {
        display: block;
        content: "";
        margin-top: 0.5rem;
      }

      .article-content .italic {
        font-style: italic;
      }

      .article-content .text-pink-700 {
        color: #db2777;
      }

      .article-content .text-pink-800 {
        color: #9d174d;
      }

      .article-content .mb-2 {
        margin-bottom: 0.5rem;
      }

      .article-content img {
        max-width: 100%;
        height: auto;
        margin: 1.5rem 0;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border: 3px solid #831843;
      }

      .article-content code {
        background: #fbcfe8;
        color: #be185d;
        padding: 0.125rem 0.375rem;
        border-radius: 2px;
        font-family: monospace;
        font-size: 0.875rem;
      }

      .article-content pre {
        background: #fdf2f8;
        border: 3px solid #831843;
        padding: 1rem;
        margin: 1rem 0;
        overflow-x: auto;
        box-shadow: 4px 4px 0px 0px #ec4899;
      }

      .article-content pre code {
        background: transparent;
        padding: 0;
        border: none;
      }

      /* AI速览模块样式 */
      #ai-summary-text {
        line-height: 1.8;
      }

      #ai-summary-text .summary-point {
        margin-bottom: 0.75rem;
      }

      #ai-summary-text .summary-point-number {
        color: #db2777;
        font-weight: 700;
        margin-right: 0.5rem;
      }

      .animate-spin {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .article-content blockquote {
        border-left: 4px solid #ec4899;
        padding-left: 1rem;
        margin: 1rem 0;
        color: #be185d;
        font-style: italic;
      }

      .article-content a {
        color: #ec4899;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .article-content img {
        max-width: 100%;
        height: auto;
        border: 3px solid #831843;
        margin: 1rem 0;
        box-shadow: 4px 4px 0px 0px #ec4899;
      }
    </style>

    <script>
      function toggleMobileMenu() {
        const menu = document.getElementById("mobileMenu");
        menu.classList.toggle("hidden");
      }

      const observerOptions = {

            '## Idea记录\n\n### 第一章\n\n1. 香皂的产品质量无法拉开差距，香皂生产的技术也不会有显著性差异，想要和其他产品产生明显区别，主要靠市场驱动，但更主要的是做定位、做营销、做渠道。\n   Idea：初期的产品经理受快消费时代影响，产品的技术和质量同质化较高，产品类型也更加初级，所以产品主要依赖于市场驱动。\n2. 以产品经理作为驱动力的产品与销售管理体系逐步建立，并开始允许公司内部品牌旗下的产品在市场上相互竞争。\n   Idea：快消费时代产品的提升更多依靠市场上的竞争，由市场来推动产品的完善。伴随着产品的完善，产品的生命周期拉长，产品经理的责任制度逐渐形成\n3. 软件时代的产品经理偏重于进行项目管理和推进，按照客户的要求准时上线产品。\n   Idea：进入软件时代，客户的需求被放大，但对于产品后期的要求没有被重视,对产品的设计要求也相对较低。更多的是保证产品可以正常的使用，不会经常出现漏洞。\n4. 用户更容易搜寻、度量、比较不同产品，使得市场竞争更激烈，出现马太效应\n   Idea：互联网时代的发展让产品在大量用户间传播的更快，用户的需求和体验感更加被放大，产品间两极分化严重。Q:底层产品在这样的生态下如何竞争成功？\n5. 产品要经过需求，生产，销售三个环节。产品经理要对产品的市场结果负责，需要对这三个环节分别进行关注，并"协调"公司不同分工下的不同职能。\n   Idea：产品经理需要先分析用户需求来定义产品，规划产品架构。有了大致的框架和清晰的方向后，设计出满足需求的产品，这样才有市场，有用户。最后，将产品销售出去，完成和用户的交易。\n6. 每一个影响时代的新要素出现后，跟我们的生活和生产方式结合，就能创造无数的新产品，我们可以根据需求去判断可以做什么。\n   Idea：新要素出现，人们对于新要素的使用会有新的需求，针对需求分析新时代下产品经理可以做什么，对于那些需求进行深挖。\n7. 在互联网时代，产品经理的"销售"和"协调"工作做得平庸一点，不是严重问题。而对"需求"理解的好坏，往往能够决定一个产品的生死。\n   Idea：互联网时代分工更加细化，销售由专门的人员更多负责。互联网产品只要让用户用上就是完成了销售。所以钻研需求，让用户用上产品反而更加重要\n8. 我们依然要研究总结很多经验和规律，便于预测用户行为、市场变化，也便于指导未来的决策，这样能提高企业效率。但我们要明白，人有异质性，社会有情境性，这些与产品相关的经验和规律只是具有统计意义上的显著性，只可归纳，不可演绎。\n   Idea：产品工作偏向社会学科，不具有重复性，很多总结的规律和经验应用时需要结合具体问题分析\n9. 用户模型视为产品经理的合格线，掌握的标志是：预判产品迭代后的用户行为变化，准确率较高。\n   Idea：用户模型的掌握为什么以对后续迭代行为变化判断是否正确为标志，而不是以对用户需求是否解读到位为标准\n10. 产品经理不但要研究行为，更多的是要研究行为背后的意识，从而预判不同的产品对用户未来行为产生的影响。\n    Idea：产品经理更多要研究现实世界的意识，意识背后是用户，所以本质更多关注用户\n11. 微观场景是直接影响用户当前意识的环境。\n    Idea：微观场景更多聚焦于用户在当下场景的需求有什么，比起宏观场景微观关注于用户在日常生活中小的生活场景\n12. 交易模型要求产品经理除了掌握用户模型，还能理解一个领域各利益方的价值判断和行为习惯，以及产品实现过程中的各种干扰因素。\n    Idea：交易模型需要以交易为导向，建立可持续交易。因此要求分析用户利益和各种干扰因素来保证交易的互惠和可持续性\n13. 因为用户关心的是得到什么和付出什么，包括这个产品给他什么效用组合，需要他付出多少金钱或时间等。用户同样也会比较机会成本，看这个产品是比其他产品更好用还是更让他离不开，从用户角度来看，这就是一个交易过程。\n    Idea：用户更在意的是自己使用产品的投入产出比，用户在使用产品的时候也是在进行情绪价值的交易，思考如何创造更多的用户价值是产品经常强调的。\n14. 一个好产品要有三个属性：（对用户）有效用，（企业）有收益，可持续。\n    Idea：产品经理分析时要兼顾用户需求与企业利益，不能完全被用户需求所牵制，同时也要思考对企业的收益与是否可持续\n\n### 第二章\n\n1. 企业以产品为媒介，与用户进行价值交换，达成创造商业价值的目的。\n   Idea：企业通过创造用户价值来吸引用户使用产品增加持续收益，获得商业价值。\n2. 企业在给定条件下，选择满足哪些用户需求，创造哪些用户价值，以更多地促成交换，让企业有最高的边际收益和ROI（投资回报率）。\n   Idea：产品经理需要判断哪些需求是可以去满足的\n3. 我们知道影响用户行为的有偏好、认知、情境（包含五步）\n   Idea：偏好和认知会驱动用户自发地产生行为，如果这方面做的较少，需要情境来辅助刺激用户产生行为\n4. 因为用户不一样，所以我们说的理解用户，是要从具体的个人去积累一个一个案例。\n   Idea：这里是将个体用户的数据汇总来总结规律，而不是把规律嵌套进用户之中\n5. 人主观感知的效用越大（欲望满足程度越高），幸福度越高\n   Idea:前文提到欲望驱动行为的原因\n6. 有些宗教教义或心灵鸡汤就是通过降低个人欲望的方式让人提升幸福感。\n   Idea：在消费主义和电商发达的时期降低欲望会比较困难\n7. 人做决策的约束条件是价值最大化，\n   Idea：做决策的时候人会自然的选择价值最大化的选项，价值最大化和相对价格有关，相对价格影响着资源配置，市场运作，高层决策等\n8. 用户价值 =新体验–旧体验– 替换成本\n   Idea：用户价值是用户在思考体验的成本并比较后得到的。但是具体到产品感觉体验很难量化。\n9. 产品是一种价值交换的媒介，企业用产品与用户交换价值。\n   Idea：公司利用产品输出价值 公司将产品价值提供给用户，用户将用户价值反馈给用户。用户价值的反馈有助于产品的迭代\n10. 分析产品的重点是弄明白这个产品利从何来、利往何去，它创造了什么价值，价值是怎么分配的。\n    Idea：产品与价值密不可分，分析产品的重点是搞清楚产品服务于谁，这些人群可以带给产品什么利益，这个利益又会分配给谁，他在用户那里创造的价值有什么，对这些价值的细分并分析等等\n11. 以创造用户价值为目的，打破一个旧的利益平衡，建立一个对己方有利的新产业链，这样的产品才容易成功。\n    Idea：产品的目的是创造更多的用户价值，最终目的的打造对自己有利的产品，并形成产业链创造长期收益。\n12. 洞察：这其实是利用信息不对称获利。\n    Idea：利用信息差发现风口，从而改变约束条件，利用新的方式来实现利益最大化\n13. 产品经理这个职业能为企业创造最大价值之处，就是在于"发现市场获利机会"，但不幸的是，这里往往存在类似阿罗信息悖论\n    Idea：产品经理通过分析市场挖掘需求来洞察市场获利的机会，但是发现机会距离成功落地有很长的距离，且成功的影响因素很多，不能完全说成功来源于发现\n14. 企业的边界只能扩大到因企业内部科层增加而增大的组织成本等于外部市场交易成本之时\n    Idea：企业内部科层的增加会增加内部的管理成本，外部市场交易成本包括原料成本，发现市场价格的成本、谈判和达成契约的成本、交易过程不确定性的风险成本等。例如当企业开通新业务时管理成本必然增加，企业发现向外寻找供应链厂商、谈判成本等等高于企业自身搭建供应链的成本，那么企业会选择扩张来满足业务需求\n15. 尤其是一些大型互联网企业对人类生活的影响太大了，其影响和控制的深度、广度使它们早已不适合继续用传统企业的经济人定位。\n    Idea：互联网企业对人们影响过于大，比起追求经济效益，企业更应该承载社会发展，通过产品引导人们走向和谐美好社会\n16. 这些信息不是know-how，或者最多是know-how的一部分，只有团队成员亲自一路摸爬滚打所验证和积累的知识和理解才是有效的know-how，才能为企业在该领域的未来竞争和决策提供有力帮助。\n    Idea：相比于经济效益，后三项更是决定企业是否良性生存下来的关键\n17. Q=Fr（L，K，M，C：T）\n    Idea：Q：企业产量  \n    r：外部规则（外部的法律政策社会地理等外部因素的改变）\n    T：技术（第二重要的因素）\n    L：劳动力\n    K：资本 M：原材料\n    C：给定外部条件下的内部游戏规则（长期竞争力的核心因素，企业内部应该优化的部分）\n18. 所以"产品即交易"里的"交易"，是指把人的任何有意识行为，看作付出预期代价购买预期收益\n    Idea：预期代价: 指在做出某项决策或进行某项投资时，预期需要支付的货币、时间、体力等代价。这些代价是决策过程中必须考虑的因素。\n    预期收益: 指在做出某项决策或进行某项投资后，预期能够获得的回报。这些收益可能包括金钱、时间节省、精神满足等。\n\n### 第三章\n\n1. 在没有强迫或欺诈的前提下，拥有自由选择权的理性人，只有在预期收益大于直接代价，且预期收益大于机会成本的情况下，才会做出交易行为\n   Idea：\n   预期收益大于直接代价：理性人在考虑是否进行某项交易时，首先会评估预期的收益是否大于所需的直接付出代价。如果预期收益不足以覆盖直接代价，那么理性人通常不会进行该交易。\n   预期收益大于机会成本：机会成本是指为了得到某种收益而放弃的其他潜在收益。理性人在进行交易时，不仅要看总收益，还要比较这些收益与因选择该交易而放弃的其他机会的潜在收益。只有当预期收益大于这些机会成本时，交易才会被理性人视为有价值的。\n2. 这就是这个世界无时无刻不在发生交易的原因——交易创造价值。\n   Idea：交易不仅是价格上的等价交换，更主要的是用户在经过主观和理性分析之后做出的行为，这个行为背后为双方增加了新的价值，相比如市场上的价格价值，其背后的新增加的价值更会驱动用户交易\n3. 交易模型在某种意义上也是商业模式，是多边关系平衡的利益创造和利益分配模式。\n   Idea：利益创造：如何创造收益（利从何来）利益分配：如何分配利益（利从何去）\n4. 企业行为的权重，按影响用户交换行为的ROI排序\n   Idea：ROI（投资回报率）强调企业在进行各种行为时，应优先考虑那些能够带来最高投资回报的行为。\n   不同行业对ROI的影响因素各不相同：\n   电商和外卖行业：价格通常比使用体验更影响用户行为，因为用户可以轻松比较不同平台的价格。\n   视频和内容类产品：供给比使用体验更影响用户行为，因为内容的丰富度和可获得性是用户选择的关键。\n   搜索引擎和工具类产品：使用体验和先发优势的影响权重较高，因为用户对产品的依赖度较高。\n5. 而如果配送速度这个高优先级需求得不到满足，其他效用在这个情境下都无从谈起。\n   Idea：或许应该思考一下怎么丰富产品功能来满足客户个性化及时性的需求来留住用户\n6. 理论上可以一直做到边际收入等于边际成本的均衡点，\n   Idea：\n   边际收入：指增加一个单位产量所带来的总收入的增加量。\n   边际成本：指增加一个单位产量所带来的总成本的增加量。\n   在经济学中，厂商利润最大化的条件是边际收入等于边际成本。当收入大于成本时，增加产量可以增加总利润（因为边际收入是按单位产量计算的）；当收入小于成本时，减少产量可以增加总利润。只有在MR等于MC时，厂商的利润达到最大。\n7. 其生产的时候一开始有规模效应，边际成本是逐步降低的。但到了某一个临界点后，其边际成本反而有可能会变高。\n   Idea：\n   规模效应: 当生产规模扩大时，由于固定成本被更多的产品分摊，单位产品的成本下降，这就是规模效应。例如，生产更多的汽车可以降低每辆车的制造成本。\n   边际成本：在一定产量水平下，增加一个单位产量所引起的总成本的变动数。它通常只考虑变动成本，因为固定成本在短期内是不变的。\n   边际成本递减: 在生产初期，由于规模效应，边际成本往往呈现递减趋势。这是因为固定成本在总成本中的占比逐渐减少，而变动成本增加的比例较小。\n   边际成本递增: 但是，当产量达到一定程度后，继续扩大生产可能会导致边际成本上升。这可能是由于资源限制（如原材料短缺）、管理复杂性增加（如协调更多工人和设备）、过度使用设备导致维护成本上升等因素。\n8. 对交易成本的理解和分辨有助于产品经理更清晰地思考"成本"和"交易模型"。\n   Idea：理解交易成本有助于产品经理在分析时准确划分什么是成本，交易背后的隐性成本有什么，是什么样的成本阻碍了用户交易产品\n9. 移动互联网带来的交易量包括两个部分，一部分是替代效应，即对原有实体交易的替代。\n   Idea：\n   替代效应：互联网时代电商对原有实体产品的替代，交易费用降低，更低的费用让用户愿意支付。\n   新增效应：降低了交易费用使原来交易费用较高的交易得以实现。是市场新增了产业，社会资源的配置发生了变化。\n10. 网红带货降低了什么交易成本？\n    Idea：\n    搜寻和度量成本：用户基本依靠网红直播推荐来购买产品\n    寻价成本：网红在带货前与供货商进行了砍价议价\n    决策成本：依靠主播气氛烘托（321上链接）和用户对主播的信任，决策变得简化\n11. 供需定律是描述市场供需和价格变化的基本规律，当需求大于供给时，价格上升，当需求小于供给时，价格下降。\n    Idea：这个定律在实际应用中要注意是在其他条件不变的前提下，价格和需求的关系才成立，因为在现实时候中，价格并不是影响用户需求的唯一因素。\n12. 相对价格 =（直接成本+交易成本）÷ 效用组合\n    Idea：直接成本或交易成本降低，相对价格也降低。需求量增大\n\n### 第四章\n\n1. 旧体验最小化，本质上是选择旧体验最差的被替代品的用户\n   Idea：\n   旧体验: 是指用户在使用现有产品或服务过程中积累的经验，这些体验可能包括操作不便、界面不友好、功能不齐全等。\n   最小化: 在不影响现有用户的基础上，尽可能减少其负面影响。\n2. 如果潜在需求量较大，且看到有一种新要素（不论是降了某种成本还是提高了某种效用）\n   Idea：潜在需求量增加会导致市场需求增加，经济增长；新要素的出现会降低交易成本，提高用户效用。两者都会导致市场增长，企业先抢占先机，可以扩大自己的优势。\n3. 宏观经济学中有个重要概念叫卢卡斯批判。\n   Idea：卢卡斯批判也是在说分析时没有充分考虑人的主观性对分析结构造成影响\n   卢卡斯批判：传统政策分析往往没有充分考虑到政策变动对人们预期的影响。根据理性预期理论，人们在形成预期时会同时考虑历史信息和当前事件，并根据这些信息调整自己的行为。因此，当政策发生变化时，预期也会相应改变，进而影响人们的行为决策。\n   预期调整：卢卡斯认为，由于人们会根据当前的政策变动调整他们的预期，经济主体会根据新的预期改变自己的行为，使得经济模型难以准确预测和评价政策效果。\n   参数变化：政策变动引起的预期变化会导致经济模型中的参数发生变化，而这些参数的变化往往是难以量化的，这使得用计量经济学模型评估政策效果变得复杂。\n4. 主观判断决策是最难的决策，没有数据或逻辑支撑，只能用关键变量和用户模型、交易模型来模拟市场运行，并据此做出判断。\n   Idea：成本上，数据判断＜逻辑判断＜主观判断，越难的决策它所获得的有效数据和信息越少，越需要依靠决策者的经验知识储备和决策力\n5. 大脑自有一些处理资讯的规则，为了增进决策与判断效率的"心理捷径"称作捷思，捷思有时会产生一些不好的效应，这些不好的效应称作认知偏误。\n   Idea：认知偏误是由于大脑为加快决策的速度和效率而选择走捷径后，所造成的负面影响\n6. 相当于以强推动能力交换降低的决策能力，这时的边际收益可能更大。\n   Idea：在某些特定情况下，通过增强推动力和执行力，即使决策能力下降，仍然可以获得边际收益和回报\n7. 媒体议程在某些方面影响公众观念或者与之发生相互作用，即公众议程。\n   Idea：媒体对议题的呈现和建构会有倾向性，这种倾向性会影响公众的态度\n8. 产品设计本质上就是利益分配的过程。\n   Idea：根据滴滴各个权衡的例子可以看出产品经理在遇到问题时，最困难的一点如何权衡各方利益，模拟在情境下用户的心情，问题和痛点有什么。\n\n### 第五章\n\n1. 制度一旦开始演化就有自我强化和收益递增的特点\n   Idea：收益递增的原因\n   初始成本与运行成本: 制度在创建初期往往需要投入大量的初始成本，例如制定规则、建立机构等。一旦制度建立起来，其运行成本通常会显著降低。意味着随着时间的推移，制度的实施单位成本会下降，从而带来整体效益的增加。\n   学习效应: 组织和个人在适应制度的过程中会获得经验，这种学习效应会增强他们对制度的理解和利用能力，进而提高制度的效益。\n   稳定预期: 制度为各方提供了稳定的预期，增强了人们对制度持续存在的信心。这种信心使得制度更有可能被长期坚持，从而形成收益递增。\n   自我强化的原因\n   路径依赖: 制度演化过程中，由于存在收益递增和网络外部性，制度一旦走上某条路径，其既定方向会在以后的发展中得到自我强化。改变路径的成本和难度会随着时间的推移而增加，导致制度趋于稳定。\n   惯性: 制度演化中的惯性来自于过去的选择和积累的经验。这些惯性使得制度在面对变革时具有抵抗性，从而进一步强化了现有制度的稳定性。\n   锁定效应: 当某一制度安排被系统采纳后，其自我强化机制会导致其他潜在制度安排的排除，形成路径依赖的锁定效应，使得制度难以被改变或创新。\n2. 按天赋高低分类——ABC分类\n   Idea：产品经理按天赋高低分类：\n   a:有深度思考能力或超常同理心\n   善于思考事物背后的本质和互相的因果关系，善于洞察人心思考行为背后人们更主观的心理。\n   b:逻辑清晰且有产品心\n   不是因为外在因素，而是单纯喜欢产品经理的工作，并且逻辑清晰。\n   c:不适合从事产品经理职业\n   缺乏思考和职业热爱，同理心弱，自我认知较弱的人不适合做产品经理\n   A类人很少见，C类人很少被招进公司，B类人在公司占比更多，在工作中B类人也会被训练出A类的产出\n3. 复杂的历史进程中，通过理性推理得出正确的个人选择，在特殊条件下是可能的。\n   Idea：\n   特殊条件：\n   这件事适合理性决策\n   确信自己掌握了所有关键变量\n4. 产品经理的价值=经验等级×平台匹配度×智慧等级\n   Idea：\n   经验等级是产品经理在入行后工作实践中学到的知识，五年左右产品经理间的经验差距减小，对于产品生产迭代企业内部等掌握程度相同\n   平台匹配度是产品经理能力与平台深度绑定。产品经理一换岗位，平台匹配度会降低。不同种类的平台生态不同，产品经理在决策的时候面对的环境不同，更换平台会影响决策。\n   智慧等级是做同一件事，有更强的洞察力和分析能力。\n5. 产品经理的成长，可以用两个重要标准来判断，分别是用户模型和交易模型\n   Idea：\n   用户模型要掌握大量用户样本，分析用户，经过大量的亲身体验，模拟，反馈等预判用户的行为。只有通过在实践中反复经历磨炼才会形成。\n   交易模型要以交易成功为导向研究产品，对交易成本有丰富理解，对多边利益的权衡和博弈演化有理解。\n6. 一个产品经理的成长情况，也可以根据他这三方面能力的习得情况来判断。\n   Idea：三个方面：科学方法、人文精神和实践精神\n   科学方法：逻辑概率、控制实验、理性决策、经济学等。运用数学工具理性分析，减少认知偏误\n   人文关怀：用户样本量，同理心，心理学，进化论，博弈论等。分析和研究用户的心理，模拟不同情境下的用户，权衡多边利益。\n   实践精神：事实、数据、观察、实践、权衡、反馈、迭代、自省。\n7. 产品岗位价值 = 有价值（事）×成功率（团队）× 成功后回报大小Idea：\n   有价值：产品对用户有效益\n   成功率：团队的产品心，人才质量\n8. 带你的人＞业务＞平台\n   Idea：平台带给自己的只是标签，而业务可以提高一个人的专业能力，对于新人找到一个好的老师学习知识可以快速提高专业知识\n\n### 附录\n\n1. 真正的产品经理是三位一体的\n   Idea：\n   三位：\n   主人翁意识：把产品当成自己的子女\n   决策权\n   专业产品能力\n   一体：好的团队环境，有产品心的团队\n2. 到产品成熟期之后再参与，能够学到的就少很多了\n   Idea：产品从0到1的过程才是新手产品经理能学习更多的时候，在这个过程中可以进行无数次的权衡取舍和细节决策\n3. 再往上的第二至第五级的关键词分别是创造、权衡、变迁、方法论\n   Idea：需要产品经理跳出，纵观全局分析\n   创造：找到问题的最优解的过程，需要产品经理洞察周围，分析用户的变化趋势。\n   权衡：跳出单个需求，平衡多方利益，进行取舍。\n   变迁：跳出当下，对世事变迁敏感，预判用户需求并不断反思。\n   方法论：要有方法论输出，追求影响力和确定性。\n4. 有时候逻辑有小逻辑和大逻辑之分\n   Idea：小逻辑是指站在当下自身的角度去分析问题，大逻辑是指站在全局长远的角度去分析问题。',

          title: "《决胜B端》Idea笔记",
          content:
            '# 《决胜B端》Idea\n\n## 第一章：\n\n1. 什么数字化？\n   Idea：\n   - 国外：强调技术和商业的双重改变\n     - Digitization：数字化是将模拟信号转变为数字信号的过程。\n     - Digitalization：数字化是通过数字技术改变商业模式，提供新的营收点与价值的机会。\n   - 国内：注重商业的改变，数字化转型指技术转变为商业赋能\n     - 通过数字技术，将现实世界全面线上化、数字化、虚拟化，从而进一步提高企业的经营效率，实现商业的突破，都属于数字化的范畴。\n\n2. 负责设计公司内部使用的CRM、HRM等软件的人员，他们所设计的软件产品，并不是用来对外售卖的，而是给公司内部使用的，但是他们也被称作产品经理。\n   Idea：\n   - CRM：面向外部客户用来处理企业与客户业务，企业用CRM管理与客户互动、优化客户关系的工具，旨在挖掘客户价值认识CRM系统\n   - HRM：面向内部员工用来处理企业和员工的业务，涉及员工招聘、培训、薪酬、绩效等\n\n3. 产品经理必须能够定义问题、解决问题、为价值交付负责，而传统企业和IT公司的BA以及项目经理，更多对软件项目的交付负责，这也是区分两者的关键。\n   Idea：\n   - 产品经理：\n   - 定义问题：通过数据调研等方挖掘需求、分析需求、分析数据，找到用户的痛点和核心问题。反复问"为什么"的过程\n     例如：从数据分析用户线下转化率高于线上，发现用户在线上无法体验到商品质量，缺乏商品和场景的连接等问题\n   - 解决问题：设计解决方案、功能转化、设计、需求评估和排序，并推动落地实现。反复问"怎么办"的过程\n     例如：针对用户线上转换率较低的问题，尝试设计AR购物助手辅助决策，增强场景化\n   - 价值交付负责：对后续产品的商业成果（收入、用户增长）或用户价值（增强体验感）负责\n     例如：关注助手功能上线后的用户活跃度，关注问题是否得到解决\n   - BA/项目经理：对软件交付负责，保证需求准确传递项目按时交付，确保需求本身合理性和流程合理性\n\n4. 互联网公司习惯将产品分为C端产品、B端产品、数据与策略产品、商业变现产品和AI产品\n   Idea：\n   - C端：C端产品也叫2C(to Customer)产品，是面向终端用户或消费者的产品，往往承担流量获取和转化的重任。- 用户是个体：服务的是用户 - 强调交互体验：注重产品的每一个细节都追求为用户提供更好的体验 - 数据驱动设计：通过用户使用产品后的数据来分析，优化方案 - 收益容易量化：每一项功能设计都有数据反馈 - 运营决定存亡：卓越的运营可能可以弥补一般的产品设计\n   - B端：2B(to Business)产品，使用对象是企业或组织，用来解决某类经营管理问题，承担着为企业或组织提高收入（规模）、提升效率（效率）、降低成本（成本）、控制风险（风险）、保证品质（品质）的重任。\n   - 目标用户是一个群体：B端产品的目标用户群体是某个业务团队或组织，这一组人需要共同协作来完成工作，所以需要B端产品来帮助他们实现分工协作。\n   - 用户和客户是不同的人：如果是商业化售卖的B端软件产品（例如CRM产品销售易、纷享销客），在多数情况下，购买软件的客户（严格来讲应该是购买关键决策人）和软件的最终用户（即用户）不是同一个人，比如购买销售易这款软件的客户是企业，购买决策人主要来自销售业务的负责人，但软件的最终用户是一线销售人员和主管。\n   - 效能第一，体验第二：B端产品的目标是解决组织的某类业务问题，因此聚焦于流程，提升业务效能是最重要的，打磨交互体验则处于次要地位。\n   - 强调抽象和逻辑：B端产品背后的业务复杂度高，人员、分工、协作、流程、规则随时可能调整，这就需要产品经理有非常强的抽象能力和逻辑思维，将看似散乱无章的业务抽象出共性，进行合理建模和设计。\n   - 收益难以量化：B端产品要支持、解决业务问题，但业务成效的影响因素非常多，很多时候并非取决于B端产品设计的好坏。\n\n5. 例如，设计产品时并不会过多地考虑UI设计，也不会为了几个按钮的摆放位置花费太多时间，即便某个功能的交互设计不太符合常理，业务人员为了完成工作也还是会使用软件（但这并不意味着B端产品经理可以无视交互体验）\n   Idea：全面的设计功能，注重逻辑闭环，站在牛马使用办公软件的角度去设计产品，对于体验和交互的设计逻辑和细节相对弱化，因为牛马为了完成任务比c端用户更愿意付出时间和学习成本\n6. 对于滴滴来讲，给专车司机使用的App和给快车司机使用的App，分别属于B端产品还是C端产品呢？\n   Idea：\n   - 给专车司机的app：B端（更偏向传统B端产品）\n     - 用户群体：专车司机，与公司有劳务关系\n     - 产品定位：为专车司机提供服务，为开展打车业务，赋能司机的工作工具\n     - 核心目的：支撑业务运作\n     - 特点：包含更多企业级功能，如培训，服务标准，接单量的评比等，面向专车司机一个群体\n   - 给快车司机使用的app：B端\n     - 用户群体：快车司机\n     - 产品定位：为快车司机提供服务，为开展打车业务，赋能司机的工作工具\n     - 核心目的：支撑业务运作\n     - 特点：功能量级较轻，注重灵活调度司机，个人收入统计，有一定个性化的设计，面向专车司机等个体用户\n7. B端的分类：\n   Idea：\n   ![alt text](image-11.png)\n8. 中台产品，在业界并没有权威的、统一的定义或解释，很多企业对中台产品定义不同，可能包括了电商交易系统的模块，例如订单、商品，也可能包括了企业特殊的业务模型层，例如统一定价中心、内容分发中心，而所谓数据中台，则包括了数据仓库、BI可视化等，除此以外，中台可能还包括消息推送、统一权限管理、支付中心这类基础服务\n   Idea：\n   数据仓库：数据仓库是数据中台的核心组件\n   BI可视化：将数据仓库中的结构化数据通过图表、仪表盘等形式直观展示，降低数据使用门槛，辅助员工利用数据决策。\n   中台产品：针对业务中的模块，介于企业前台例如直接面向用户的App、网站等和后台例如基础设施的数据库等之间的中间层，\n9. SaaS是指软件的部署、交付方式，将标准化软件产品部署在云端，通过多租户形式提供给不同的客户使用。\n   Idea：对Saas的细分解释\n10. 数据产品是对企业内外部所有数据进行挖掘并利用的产品，通过数据反映出来的深层次信息来有效提升对应业务的绩效。\n    Idea：相比于中台产品，数据产品要更深一层，将企业数据可视化，方向包括数据仓库建设、应用层设计、算法策略输出、数据监控等\n    ![alt text](image-12.png)\n11. 商业变现产品，顾名思义，就是帮助互联网企业将流量转化为收入的产品。互联网企业往往手握巨大的流量，最常见的变现方式就是广告售卖，具体产品形态包括搜索引擎营销、广告投放平台、在线广告联盟，除此以外，有些公司会把提供增值服务的产品也归为商业变现产品\n    Idea：互联网企业通过产品转化为收入的方式：将流量变现，具体形态包括搜索引擎营销、广告投放平台、在线广告联盟及增值服务的产品\n\n12. ![alt text](image-13.png)\n    ![alt text](image-14.png)\n    Idea：\n\n- 业务型：服务于企业核心业务的模块，对企业影响较深，因此业务相对复杂，诉求倾向于个性化多样化\n- 工具型：工具属性更强，服务场景单一，诉求明确统一，提升企业协作和效率 例如：飞书、钉钉\n- 交易型：不同业务模式的标准化程度不同，以交易或支付为核心场景 例如：银联商务\n- 基础服务型：为了支撑企业的软件应用架构建设、软件的抽象化设计而存在的 ，服务于底层技术能力的设施 例如：阿里云\n\n13. 除此以外，行业中还会将SaaS分为业务垂直和行业垂直两个方向。\n    Idea：通过不同角度切入产品，聚焦到一个领域或业务进行标准化产品设计\n    ![alt text](image-15.png)\n14. 利用迈克波特价值链模型，是希望大家能够培养一种将B端软件和企业经营结合在一起分析的思维意识\n    ![alt text](image-16.png)\n    Idea：业务型产品在模型中的分类及作用\n    业务型是企业经营运作的核心，负责宏观上业务的开展和管理\n    工具型是运营运作的补充，支撑在细分场景下的效率\n\n## 第二章：\n\n1. B端产品建设流程：\n   Idea：\n   ![alt text](image-17.png)\n2. B端业务流程\n   Idea：\n   市场分析和业务调研\n   - 做市场分析，找到目标用群体\n   - 调研目标群体挖掘需求痛点，总结业务问题\n     产品整体方案设计\n   - 梳理整个业务主干流程，确定需要线上的流程\n   - 确定产品的目标群体核心价值，明确产品定位、用户定位，了解业务目标\n   - 考虑产品和外部系统架构环境的融合关系\n   - 抽象出该产品的具体模块\n   - 根据业务优先级与发展策略对功能进行评估排序，制定后续研发规划和项目节奏\n     产品细节方案设计\n   - 抽象出数据建模与流程建模，分析业务细节，设计产品具体功能\n   - 管理团队人员在项目中的角色安排\n   - 对业务运行的过程与结果呈现\n     技术方案设计\n   - 保证软件系统在正确的技术选型和合理的技术架构\n     项目管理与实施\n   - 设计合理的研发流程和机制，确保项目保质保量的交上去\n     运营迭代\n   - 包括宣传、推广、使用效果分析等\n   - B端产品包括落地推广、培训、问题处理、需求采集等\n\n3. B端与C端的产品流程对比\n   ![alt text](image-18.png)\n   Idea：B端与C端的不同\n   ![alt text](image-19.png)\n\n4. 案例讲解：\n   Idea：\n   - 背景\n     - 集团背景：M集团经营十几年的成功企业，旗下拥有零售连锁超市、生鲜电商、金融理财等多个业务线，系统成熟\n     - 业务特点：M公司主营生鲜商品，以C端用户为主，业务稳定，成立较早系统成熟\n     - 新业务概述：尝试开展分销业务，将生鲜品卖给企业客户\n     - 目标客户：大型餐饮连锁集团，以及大型生鲜分销商等企业级客户\n     - 试点：三个月前在北京、上海开展\n     - 现状：目前分销业务月流水50万元，以每月20％的增幅快速发展。但是，在高速发展中，若干流程、管理、风险问题越来越突出\n   - 诉求\n     - 需要配套的软件系统来提升业务效率，控制经营风险，将分销系统内部使用\n     - 将分销系统作为公司新业务，可以作为SaaS化软件产品对外售卖\n     - 评估\n     - 管理层投入研发资源建设软件系统\n     - CTO全力提供资源支持\n   - 目标：\n     - 在两到三个月的时间内搭建一套分销业务平台，至少支撑分销业务在未来两年内的高速发展，有效地提升效率、控制经营风险\n     - 在内部系统落地成熟后，将这套分销业务平台SaaS化对外售卖。\n   - 员工：\n     - 老马：\n       - 员工画像：资深产品专家，从业时间长，对交易电商系统建设有丰富的经验，在甲乙公司均有工作经验\n       - 职位：在项目中作为产品总负责人牵头完成分销平台的设计规划\n     - 果冻\n       - 员工画像：毕业一年多的初级产品经理，增加工作经历，经历从无到有的设计过程\n       - 职位：老马的助手参与分销平台设计\n\n5. 当我们接手一件比较复杂的工作时，制订明确的工作计划是一种良好的工作习惯。\n   Idea：第一步在了解项目任务和ddl之后，梳理工作思路，拆解任务，输出项目中各个角色的时间计划\n   初期项目可以是粗颗粒度的，以周为单位或者以天为单位，角色可以只有产品经理一个人，没有团队或者项目组的展示，通过计划对项目有基本的判断和预期\n\n## 第三章：\n\n1. 针对商业化产品，我们可以从外部和内部两个视角进行分析研究工作。\n   Idea：\n   ![alt text](image-20.png)\n2. 分析的层次和角度也要取决于软件产品本身的定位特点，如果是行业一体化解决方案，则必须要理解客户的产业链；而如果是适用于不同行业的业务型或工具型产品，则分析客户产业链的意义不大。\n   Idea\n   - 一体化解决方案：为特定行业设计，覆盖业务全流程，解决的问题更加复杂，贴合具体业务打造的产品\n     - 需要理解上中下环节的角色分工、痛点分布\n     - 理解产业链辅助设计处贴合特定行业特性的产品\n     - 忽略实际产业链可能脱离场景，造成避免闭门造车\n     - 例如：聚焦于房地产的明源云，除了研究房地产企业本身的业务运作，还需要在宏观层面上广泛研究土地政策、原材料供给等产业相关问题。\n   - 不同行业的业务型或工具型产品：产品功能普适性较强，适用于多个行业，侧重解决通用性需求，更多用途在于提高办公效率企业内部管理上\n     - 功能不依赖业务逻辑，相对标准化模块化\n     - 用户群体为员工，关注点在于功能的易用性、便捷性，而不是与行业本身是否匹配\n     - 过度分析产业链会导致被困在特定场景，忽略了功能的通用性，造成功能冗余\n     - 例如：对于一款工具型视频会议产品，研究的重点应该是不同行业会议应用场景的特点，而没必要分析客户所在的产业链结构。\n\n3. 虽然目前这款产品会首先在内部使用，但是公司也考虑下一步将其商业化对外售卖呀，所以我们要提前对市场进行分析。而且我们自身的定位是农产品流通的整体数字化解决方案服务商，并不是局部的供应链软件提供商，所以有必要对整个产业链进行梳理。\n   Idea：根据用户的诉求产品分析时必须立足长远目标，将视角放在宏观的产业链全局\n4. 在农产品分销软件平台领域，市场占有率最高的3家软件供应商，总共占据了40％的市场份额，则说CR3=40％，是一个竞争充分的市场\n   Idea：CR3是"行业集中度指数"的一种，表示前三家最大企业在市场中的份额总和。CR3越高说明市场集中度越高，只有少数几个企业主导这个市场；CR3越低，市场越分散，竞争更激烈\n5. 从某些维度将市场进行细分。\n   Idea：\n   - To C：细分客群的维度可能包括年龄、性别、地域、工作类型。例如：抖音的目标用户群体是一二线城市年轻人，快手则是三四线小镇青年\n   - To B：细分企业客户的维度可能包括行业、企业性质、营收规模、地域等。例如：在全球财务软件领域，Oracle EBS的目标客群是巨型、大型企业\n\n6. 完整的竞品分析工作和自己做一份产品的商业计划书要研究的主题大同小异，思路是一致的\n   Idea：商品计划书：\n   - 目的：向投资人证明产品可行性\n   - 思路：市场需求存在->产品可以有效解决市场需求和用户痛点->目前有能力实现->实现的ROI很可观\n   - 相同点：都需要进行市场分析、竞品的分析、通过竞品说明自己产品的优势等，强化产品和竞品的差异性，需要查询大量的数据\n   - 不同点：\n     ![alt text](image-21.png)\n\n7. 对于设计自研系统的产品经理，竞品分析工作主要是指了解竞争对手所使用的相关系统的设计原理和思路，而研究系统该如何设计，本质上需要理解系统背后业务运作的模式和机制。如果你是一名自研系统的设计人员，竞品分析研究工作的重心应该是业务本身，如果只研究竞争对手的软件系统，是不可能掌握其设计精髓的，因为系统只是承载支撑业务的一种工具，只有掌握了业务运作的特征，才能深刻理解系统设计的原理。\n   Idea：系统设计的背后逻辑是通过功能分析业务逻辑，C端的逻辑可能是从竞品的设计中分析用户的行为路径和心理，所以分析不应该停留在功能层，应该深入逻辑\n8. 将企业所在的市场划分成三种典型的结构，分别是正三角、倒三角、枣核型，横轴宽度代表企业数量，纵轴从下到上代表企业营收规模增加\n   Idea：\n   正三角型：\n   - 底部营收规模小的企业多，往上规模越大但数量减少\n   - 技术壁垒较小，入行门槛较低\n   - 举例：农业，农业的底层规模比较大，大部分为分散的小农户，中层逐渐减少，多为农业合作社，高层为大型农业企业\n     倒三角型：\n   - 底部规模小的企业数量小，往上规模大的企业数量增多\n   - 技术壁垒较高，头部企业掌握核心技术，具有垄断性，用户集中\n   - 举例：社交平台，头部例如微信等，底部类似抖音等有社交属性平台\n     枣核型：\n   - 头部和尾部的企业数量少，中等企业多例如：教育行业，SaaS行业\n   - 有一定技术壁垒，更多是品牌形象和产品差异化的区别\n   - 举例：智能手机制造，头部为IPhone，中部可能是OPPO、vivo，底层也比较少，早年的乐视手机一类\n\n9. 以上三种市场结构中哪种适合成为SaaS产品的目标市场？\n   Idea：枣核型，这类市场中等企业偏多，相比尾部小规模的企业，中部的企业更加稳定，同时有标准化管理企业和业务的需求，企业有一定付费的能力。且中部企业也处于向头部企业学习和探索的时期，比较关注学习大企业的管理体系和经验\n   答案：在枣核形市场中，腰部中型企业数量多，这类企业的业务度过了探索期，发展稳定，逐步走向正轨，需要软件产品解决业务运作中的问题，且企业付费能力强。还有很重要的一点，就是个性化需求相对可控，因为中等规模的企业本身还处在学习的过程中，更希望参考、吸收、学习大型头部企业的管理经验，所以背后的需求相对收敛，容易做出标准化产品。\n10. 还有一种哑铃形市场，两头大中间细，这种市场同样不适合做SaaS产品。你可以想一想为什么？\n    Idea：哑铃型市场：头部和尾部市场规模更大，中部市场规模较小，两极分化比较严重，割裂感较强\n    个人分析：尾部企业需要产品去管理企业的需求较小，对这类产品的付费能力较低，比起管理企业提升自身技术能力是更急需的；头部企业有自己独特的管理系统，同时头部企业的用户追求品质，个性化需求比较强，头部和尾部的需求；两极化比较严重，且尾部企业转化为头部比较困难，缺少中间市场过渡，所以SaaS并不适合这类市场\n    规模化困境：高端市场需求定制化，服务成本高单价高但数量少；低端市场用户规模大但付费意愿低，和SaaS标准化规模化的核心优势不相容\n    - 盈利模式冲突：成本与收入难以平衡，高端市场高客单价但获客成本极高，需要长期维护复杂功能，持续占用研发资源；低端市场用户流失率高；依赖用户量增长，但转化率低。\n    - 资源分配矛盾：高端需投入定制化开发，低端需优化基础功能，两者技术栈可能完全割裂。\n    - 用户迁移路径割裂：缺乏中端市场过渡，低端用户难以转化为高端用户\n    - 定位模糊：高端市场通常被成熟企业垄断，依赖行业积累和客户关系壁垒；低端市场充斥低价甚至免费竞品，依赖资本补贴抢占份额；SaaS企业若同时挑战两极，需面对两类完全不同的竞争对手，胜算极低\n\n11. B端业务调研的核心流程包括明确调研目标、选取调研对象、确认调研方法、执行调研计划、总结归纳\n    Idea：\n    明确调研目的\n    - 知道调研是为了什么\n    - 帮助工作朝正确的方向开展\n      选取调研对象\n    - 对象一般包括业务高管、业务经理、一线业务人员、合作伙伴高管、合作伙伴经理等\n    - 根据不同的对象获取不同维度的信息\n      确认调研方法\n    - 定性分析法\n    - 定量分析法定性定量调研分析\n      执行调研计划\n    - 确保数据的及时性和准确性\n      总结归纳\n    - 产出详细的调研报告\n\n12. 业务调研首先要明确该项业务在公司中的战略定位，因为战略定位会决定具体的经营策略，并最终影响产品方案设计。理解战略定位、战略计划，可以在产品方案设计的关键点上做出正确选择。\n    Idea：调研第一步是明确战略定位，即明确企业的诉求，产品设计出来的目的是什么\n    例如，以某自研系统场景为例，某集团决定以独立品牌开启新业务，希望两个品牌之间隔离，不希望消费者认识到两个品牌同属一个集团。\n    对于这个系统的战略定位是新业务可以独立于集团，企业的诉求是希望新业务的系统可以分割开，因此设计时可以重新搭建客户资料库，体系也隔离，给用户分离感\n13. ![alt text](image-22.png)\n    ![alt text](image-23.png)\n    Idea：\n    ![alt text](image-24.png)\n14. 某流量巨头App对销售渠道做了这样的规划：针对一线城市，计划开展大客户地推直销、中小客户电销直销；针对二三线城市，计划开展代理商合作模式。有经验的产品经理应该敏感地意识到这几种销售模式的区别非常大：大客户地推直销业务重在线下销售过程管理，中小客户电销业务重在电话作业流程管理，代理商合作业务重在业绩核算分析。三种业务模式的重点完全不同，需要建设的系统也不同，在CRM产品设计上一定要分别建设，不能糅合在一个系统中。\n    Idea：不同的业务模式注重的重点不同，场景不同，需要匹配的功能不一样\n\n- 大客户地推直销：涉及到很多线下场景，注重线下销售过程，例如线下访问客户、线下谈判合同等，所以需要关注线下过程，比如记录客户反馈、记录访问客户信息等功能\n- 中小客户电销直销：注重电话流程管理，比如记录与用户通话内容、拨号功能等\n- 代理商合作业务：注重业绩核算分析，比如业绩分成计算、业绩追踪等功能\n\n15. 不论是哪种类型的业务，我们都可以将利益方归类总结为三大类，即从企业内部（这里所说的企业，是指使用软件的企业，而非研发软件的企业）、企业外部、政策法规这三个视角进行分析。\n    Idea：\n    ![alt text](image-25.png)\n16. 项目交付制的软件产品是传统IT企业最经典的运作方式。在项目交付制中，客单价高，软件产品是一次性买断的，因此如何成功拿下客户是最重要的事情，在软件产品的设计实施过程中，会优先解决购买决策权比较大的利益方的诉求；和项目交付制不同，SaaS软件按年收费，首年年费并不高，更看重客户的续费，因此，软件能不能帮客户解决实际问题，客户用得开不开心，变得更加重要，尤其是一线执行者，作为软件最直接的用户，是SaaS产品必须重点服务的对象之一\n    Idea：通过分析将利益方分别划入涉众地图->不同的交付方式需要关注的侧重点不同，根据侧重点的大小排序各利益方的优先级\n\n- 项目交付制：客单价高但一次性买断，购买决策权的优先级>使用的兴趣和利益\n  - 象限1：重点服务 象限2：尽量满足 象限3：关注动态 象限4：保持沟通\n  - 1>2>4>3\n- SaaS软件：按年收费看中客户续费，使用的兴趣和利益>购买决策权\n  - 象限1：重点管理 象限2：保持沟通 象限3：关注动态 象限4：尽量满足\n  - 1>4>2>3\n\n17. 假设你是一名设计给销售人员使用的SFA CRM的SaaS产品经理，如果客户老板普遍反馈希望加强拜访管理功能的约束和限制，但是一线销售人员又不希望增加这样的功能，那么到底该不该加呢？作为一名产品经理，首先应该思考的是老板希望这么做的目的和诉求是什么，有没有更好的双赢的解决思路，如果深刻分析后发现老板和员工在这件事上就是存在不可调和的矛盾，必须选择其一去支持\n    Idea：老板的购买决策权较大，使用软件的兴趣和利益较小；销售是直接用户，使用软件的兴趣和利益更大，购买决策权较小；因此可以通过满足老板需求的同时优化销售人员使用的体验，减轻被监控感和约束\n\n- 老板的诉求：加强对员工的管理，将拜访客户的效果通过数据可视化，便于提升员工效率和绩效绑定\n- 销售人员的诉求：加强拜访管理功能的约束限制了员工工作的灵活性和自由度，拜访记录的透明化让员工有被监控的心理感觉\n\n18. 有人说钉钉是一款给老板使用的企业协同工具，而飞书是一款给员工使用的企业协同工具，飞书代表了SaaS软件的最新实践理念，更关注员工和一线用户，释放了团队和个人的激情与活力。你认为飞书背后的利益方有哪些，位于哪个象限？飞书为谁服务？要解决的终极问题是什么？是谁的诉求？\n    Idea:\n\n- 钉钉：上层管理数字化\n  - 功能多为考勤打卡，日报填写等\n  - 员工位置，打卡时长等数据透明\n- 飞书：工具型产品\n  - 功能多为云文档（提供多种模板），工作日历提醒等\n  - 员工与员工间组织合作输出\n- 飞书利益方：象限1：业务提出人（高层决策者）象限2：业务管理者（部门经理）象限3：外部利益者（合作厂商）象限4：业务执行者和协作者（员工）\n- 飞书服务对象：业务执行者协作者和管理者为直接使用用户\n- 终极问题：上下层的诉求矛盾\n\n19. M公司调研案例：\n    ![alt text](image-26.png)\n    Idea：调研初期，从高层向下进行调研访谈，摸清业务逻辑流程和各级别的诉求->调研报告\n    根据报告输出产品定位和概要设计，进入更加细致的调研与产品细节方案设计，通过访谈、问卷等方式明确场景设计的合理性\n    后期，对接产研团队及外部第三方进行技术层面对接\n20. B端产品与C端产品业务调研的区别\n    Idea：\n\n## 第四章：\n\n1. 我们的解决思路，就是设计一套基于非标品、动态变价售卖模型的交易平台，来支持生鲜品批发商的作业模式。MVP版本要能支持最基本的正向、逆向下单和售后作业场景\n   Idea：![alt text](image-27.png)\n\n- 非标品：没有统一规格的商品，每个生鲜商品的大小、质量都不同\n- 动态变价：供需情况，季节，产地等都影响生鲜的价格\n- 痛点：基本的农产品交易平台只是基于标品的模式设计，对非标品和动态变价这些场景没有支持\n  例子：以车厘子举例，批发商新上的车厘子新鲜程度较高，价格也定的较高；时间越久，车厘子新鲜度下降，市场需求减少，竞品变多，平台会根据这些情况来降低价格；同时不同的买家需求不同，餐厅看重车厘子的新鲜度，食堂可能看重车厘子的价格，平台应该根据非标品的属性来匹配订单\n- MVP：\n  - 正向下单：卖家在平台上卖\n    例如：早上新上的车厘子，通过商品卡片标出车厘子的状态、新鲜度，实时价格等，随着时间的推移，价格逐渐下降\n  - 逆向下单：买家在平台上描述需求\n    例如：餐厅的管理人在平台发布需求，对于车厘子新鲜度，质量等的要求，明确自己的预算；由批发商进行抢单，描述自己手下的车厘子状态（类似外卖软件上的卖家信息）\n  - 售后：商品的质量问题\n    例如：餐厅管理人上传车厘子的图片，有系统判定责任谁来承担，并联系卖家或者买家处理解决\n\n2. 产品定位是产品设计的指导思想和灵魂，梳理了核心业务流程和业务场景后，我们对客户的问题、痛点有了明确的范围界定\n   Idea：\n   - 宏观层面：产品定位是指对于一个选定的目标市场，产品的价值，解决用户的痛点和诉求\n   - 执行层面：产品由几套子系统组成，每套子系统的目标用户是谁，解决他们的什么问题。相比宏观层面，执行层面更加细化到场景\n\n3. 我们要思考的问题是如何维护、管理客户数据：是在分销平台中独立管理，还是通过公司现有的客户资料管理模块来管理？对于M公司来讲，现有C端客户资料全部存储在客户主数据MDM(Master Data Management)系统中，我们认为无论是C端客户信息，还是分销业务的B端客户信息，都是企业的核心资产，应该采用公司统一管理的方式，因此决定通过改造现有客户主数据系统，支持分销业务的客户信息存储和管理。\n   Idea：最初提出诉求的时候，新平台希望可以独立于公司运营，通用一套数据管理体系会不会让用户体感上将平台和公司的联系？\n4. 对于新设计的分销平台，该如何和公司现有系统融合呢？\n   Idea：\n   ![alt text](image-28.png)\n\n5. 分销商城前台即客户下单的H5工具，是一个经典的电商C端系统，分销客户需要在上面完成下单购买操作，也需要完成自我管理（例如对下属门店的管理，对发票、售后的管理），因此该系统主要包括购买流程和个人中心两大部分。\n   Idea：购买功能：首页、搜索、商品详情、购物车、结算（首页、搜索/推荐、列表/详情、购物车、结算、收银）\n   个人中心：个人信息、订单信息、售后处理（账号维护模块、订单管理模块、发票管理模块、售后管理模块等）\n6. 分销客户管理后台是给分销客户管理员使用的系统，主要用来管理下属门店和子账号；还需要随时了解下属门店和子账号的经营情况，因而需要查询所有下属门店和子账号的数据；此外还需要进行统一的财务管理。\n   Idea：客户管理：下属门店和子账号信息\n   数据查询：下属门店和子账号经营情况的数据\n   财务管理：门店和子账号的付款管理\n   - 客户管理模块：支持子账号管理与门店管理。\n   - 综合查询模块：实现所有可能的查询与信息检索诉求，包括门店报表、订单查询、综合报表、售后查询。\n   - 财务管理模块：支持基本的对账管理、发票管理，以及分销业务特有的预付款管理。\n\n7. 一期实现的功能原则：凡是可以手动处理和解决的问题，暂时都不做系统支持。二期项目聚焦于解决部分特殊业务刚需的诉求。三期项目聚焦风险控制，并强化运营功能。\n   Idea：AR智能购买技术一期应该聚焦在AR体验、虚拟导购上，二期聚焦在社交化分享、邀请好友、智能推荐和商品清单上\n\n## 第五章：\n\n1. 小李是XX公司的采购员，小李在工作日每天都需要拿着M公司的业务员发给他的最新商品清单和报价，检查自己所在门店的缺货情况，购买黄瓜、土豆等蔬菜，整理记录在自己的记事本上，仔细核对后，将本次采购清单用微信发给M公司的运营人员，等待对方确认。\n   Idea：建立数据模型方法：已知业务流程时，做好数据表单、识别实体并抽象出来建立数据模型。通过找到实体->梳理关系->确定关键属性\n   找到例子中的实体：梳理核心流程→提取所有名词→找到关键表单→提炼围绕关键表单的人、事、物\n   表单：就是在流程中要填写的信息单据明细，是业务型系统设计中的重要概念，表单驱动了作业流程的执行\n   - 抽离实体\n     名词：采购员、业务员、商品清单、报价、门店缺货情况、黄瓜、土豆等蔬菜、记事本、运营人员、小李、XX公司、M公司、微信\n     表单：商品清单、报价表、采购清单、记事本、缺货情况的表单——订单\n     物：土豆、黄瓜——蔬菜\n     人：采购员、业务员、小李、运营人员——下单用户\n   - 梳理关系：\n     用户与订单：1对多\n     订单与商品：多对多\n     商品和用户：多对多\n   - 确定关键属性：绘制ER图\n\n2. 在最后的这个模型中，订单究竟应该挂在‘人’上，还是挂在‘账号’上呢？订单对应的课时应该挂在‘人’上，还是挂在‘账号’上呢？如果人和账号是一对多关系，订单又该怎么挂呢？家长购买课程产生的积分应该挂在‘人’上，还是‘账号’上，还是‘家庭’上呢？学生上课获得的奖励应该挂在‘人’上，还是‘账号’上，还是‘家庭’上呢？"\n   ![alt text](image-29.png)\n   Idea：\n   - 订单：应该挂在"人"上，因为人是购买的决策人，由人进行购买行为\n   - 课时：应该挂在"人"上，课时是购买人的学习记录，主体是人；家庭账号\n   - 积分与奖励：挂在"人"上，人是主体使用者，将积分归属到人身上可以通过积分激励学习，以及课时记录也归属到"人"上，为了方便通过课时等标准量化积分，积分也应该在"人"上\n3. 因为一个门店可能有多个下单账号，而一个账号可能会变更所负责的门店，因此订单不应该关联在账号上。从业务实际场景来讲，订单也是针对门店创建的。门店的收货人可能和下单人并非同一人，收货人不应该和下单账号有关系，而应该归属于门店，所以收货人关联在门店下边。\n   Idea：账号有流动性，一个门店可能有账号123，门店是流动性较小，将订单与门店绑定稳定性强，方便订单数据记录保存\n   B端ER图设计的时候感觉应该关注责任主体是谁，寻找稳定性的主体与数据绑定，思考行为主体人是谁\n4. 不同类型的消息应该通过唯一的消息组件进行统一管理，不应该针对不同类型的消息创建不同形态的消息组件，因为后者的设计肯定会导致信息呈现的混乱和爆炸，让用户无所适从。\n   Idea：消息的作用是提醒用户有事情发生，并不描述具体细节，例如：只是通知要开会（没有会议的时间地点内容等信息）；设计时应该保存简洁性，公告和消息本质上都是通知，在首页不应该有明显区分\n   - 系统信息：由系统自动触发的信息，例如会议还有五分钟开始的提醒\n   - 人工信息：有人工发送的信息，例如客服\n     B端设计对于同类型的功能应该通过唯一组件管理，组件下在细分不同类型\n5. 那么，该如何设计灵活的前端控件呢？一个好办法就是向成熟的优秀软件学习。目前，市面上绝大多数成熟的商业软件列表页的设计都非常灵活，支持完全个性化的列表页配置，产品经理完全可以学习借鉴。\n   Idea：核心思想：学习优秀设计\n6. 设计有瑕疵的门店列表页\n   ![alt text](image-30.png)\n   Idea：\n   - 批量删除：删除的按键只有批量删除，场景单一，可以像淘宝购物车那样选择删除的场景，全选，删除停用的店铺等\n   - 搜索栏筛选门店创建时间：门店列表的信息中没有时间的描述，逻辑没有闭环\n   - 技术风险与安全风险：在列表页设计中，分页问题是一个典型的问题，如果处理不好，会造成很多潜在隐患。\n7. 一张非常常见的销售报表\n   ![alt text](image-31.png)\n   Idea：毛利率的小数位没有统一，销售额没有对齐，投诉数量保留两位小数有点多余\n   - 数字没有右对齐。这会导致用户无法直接看出数字之间的大小关系，因为无法通过长度来判断两个数字的量级差异。\n   - 没有采用千分符（即从个位起，每三位数字之间加一个逗号）。这会导致阅读者无法快速识别数字的量级。虽然千分符是西方的计数习惯，但在全球商务界被普遍采用，习惯后会发现这是一种非常好用的数字表述方式。\n   - 呈现百分比时没有统一小数位数。这同样不方便用户直接看出数字之间的大小关系。虽然原始数据中第二、第四行的小数点后是0，但要保持格式统一，写成10.00％和13.00％，不能省掉小数点后面的两位。\n   - 出现了不必要的小数位。"投诉数量"这个字段的值肯定是整数，因此没有必要保留两位小数。\n   - 没有使用占位符。单元格中如果没有内容，不应该空着，容易让人以为漏掉了数据。根据数值的含义，要么填入0，要么填入占位符"—"。\n   - 表头文字没有加粗（或用黑体）显示，不够醒目。\n\n8. 网站中注入分析工具提供的代码片段，以便网站分析工具能够准确捕捉用户行为的工作，就叫数据埋点。\n   Idea：在特定位置或发生时进行数据收集，通过埋点数据了解用户行为、产品使用情况等\n   ![alt text](image-32.png)\n   - C端：数据埋点分析用户行为，持续优化产品\n   - B端：数据埋点是考核产品使用程度的一个重要依据，也是业务用户行为分析、产品分析、产品改善的重要参考数据来源\n9. B端产品和C端产品在数据埋点的诉求和方案设计上有较大区别，产品经理应该准确理解两者的不同，以便确定合适的方案。\n   Idea；\n   ![alt text](image-33.png)\n\n10. 功能权限，指各个角色可以操作的界面、按钮等，例如管理员可以进行新增、删除、修改等操作；运营人员在同样的页面上只能使用各种筛选条件查看数据，无法做更改。数据权限，指各个角色在各页面中能看到的数据范围，例如分公司管理员在订单查询页能看到分公司的所有订单，而区域主管在订单查询页只能看到所在区域的订单。\n    Idea：功能权限是面向不同角色设计的，数据权限是针对数据范围设计的\n11. RBAC模型可以简单地抽象为ER图，即每个用户都要被赋予一个或多个系统角色，每个系统角色都对应一个明确的权限集合\n    ![alt text](image-34.png)\n    Idea：RBAC易懂版maybe\n12. 通过组织机构树控制。该方案根据账号所在组织机构树中的节点位置，来判断能够查询的数据范围。这种方式最复杂，但最灵活，能够支持各种复杂的业务数据权限诉求。\n    ![alt text](image-35.png)\n    Idea：账号与父节点相连来创建角色\n    角色的数据权限范围是当前节点及其子节点\n13. PRD编写视角的区别\n    ![alt text](image-36.png)\n    Idea：编写视角不同出发点不一样，场景视角业务性更强，叙述的时候注重描写业务方面；功能视角的技术属性更强，注重描写技术方面\n    场景视角的局限性是无法支撑描述复杂的系统，功能视角的局限性是无法叙述出复杂场景化问题\n14. PRD的编写者差异：\n    Idea：\n    - 甲方设计人员：大概率是内部自研系统，编写人关注实际业务问题和场景问题，对于技术和业务抽象较弱\n    - 乙方设计人员：大概率是需求规格说明书，以功能视角展开叙述\n\n## 第六章：\n\n1. 需求的提出人，并不一定是产品功能的使用人，而需求背后要解决的痛点也并不一定是需求提出人的痛点！需求的使用人，不一定是需求的提出人。\n   Idea：明确提出人、使用人和影响人在具体案例中指的是谁；还原需求的背后场景，理解提出人在流程中的需求是什么\n2. 通过对需求不停地问为什么，其实可以发现很多问题点和改进的机会点。当然，问题挖掘的深度和方向需要产品经理自己做好把握和判断。比如，果冻在分析完后，发现出现问题的原因之一是线索分配规则不合理，因此不能简单粗暴地直接跑去质疑销售负责人。我们分析的目的应该是洞悉本质，在合理的范围内找到更多更优的解法。\n   Idea：利用5Why方法挖掘需求产品经理大杀器\n   挖掘需求的根本目的是了解用户根本需求，从而优化功能；当需求挖掘到"哲学讨论"（例如，线索分配的不合理，人性的弱点等）角度而不是"可优化可改进"的角度应该停止\n3. 活动图(Activity Diagram)是流程图的一种，用来描述一系列过程。活动图和流程图最大的区别是，活动图可以描述并发工作的执行过程，而标准流程图的节点必须是顺序执行的，只有判断节点才能引出两条分支。\n   Idea：活动图和业务流程图都可以描述流程，活动图可以展示并行的操作，和业务流程图相比场景性更强。但是多条业务流程图好像也可以达到效果\n   ![alt text](image-37.png)\n4. 状态机图(State Machine Diagram)也叫有限状态机图(Finite State Machine Diagram)，是一种描述所有状态及状态之间流转规则的图形。\n   Idea：描述某个环节的状态的图\n   注意事项：\n   - 状态值必须是有限的集合，状态的所有枚举值（即状态值）必须能够涵盖所有实际可能的情况\n   - 状态值之间要互斥，不能出现二义性（逻辑闭环）- 二义性指某个条件、状态或定义存在多种可能的解释或归属，导致系统无法确定唯一的结果。\n   - 状态重叠：多个状态的条件同时满足，系统无法判断当前应归属哪个状态。\n     例如：订单状态定义为"已支付"和"已发货"，但未明确两者是否允许共存。- 语义歧义：状态名称或描述不明确，不同开发者理解不一致。例如：状态名"处理中"可能被理解为"等待处理"或"正在处理"\n   - 为了更准确细致地描述事物，状态还可以具备子状态，比如订单状态"售后中"，可以定义对应的子状态——"待退款待退货""待退款已退货""已退款已收货"。\n   - 状态应该是能持续一定时长的，而不应该是很快就会结束的瞬时态。例如，订单的状态可以是"待发货""待评价"，但不能是"发货中""评价中"。\n   - 在中文语境中给状态起名字时，可以尝试包含"已""中""待"三个字中的任意一个，这会使状态的定义变得清晰明了。\n\n## 第七章：\n\n1. 体验设计四个层次\n   Idea：\n   ![alt text](image-38.png)\n\n2. 尼尔森十大原则\n   Idea：原则核心在站在用户的角度设计体验，将状态转化为用户可以理解的信息\n   ![alt text](image-39.png)\n3. C端与B端的客户旅程\n   Idea：客户旅程的绘制模板及软件介绍\n\n- C端与B端的旅程地图：\n  - 区域A(Zone A)概要地描述了这份旅程的①客户画像（谁），以及②核心场景（要做什么）与商业目标。\n  - 区域B(Zone B)是核心区域，包括③细分的子场景、④场景下的分解动作、⑤客户的想法、⑥体验情绪的变化。\n  - 区域C(Zone C)是基于客户感知体验的结论输出，⑦描述了针对细分场景下存在的优化空间，⑧可以列出跟进优化的责任人。\n\n4. 服务蓝图：\n   ![alt text](image-40.png)\n   Idea：有点类似于横版的业务流程图\n   - 耗时(Time)：旅程中在每个节点上花费的时间。在本例中，开发票用了10天，也许这就是客户生气的原因。通过时间量化出来分析用户可能的痛点（和业务流程图的差别）\n   - 前台(Front Stage)：前台是指企业和客户产生直接触达的接触点，包括员工动作和技术接触点，和用户交互的过程，直接影响用户体验\n   - 后台(Back Stage)：后台指的是为支持业务运作开展的企业内部运作过程。\n\n## 第八章：\n\n1. 很多产品团队经常有一个困惑："我们的产品化面临的客户需求非常发散，好不容易提炼出共性需求，结果遇到新的客户，依然没法复用，造成团队疲于奔命、效率极低的局面。该怎么做出一套标准化产品以适配不同客户呢？"如果遇到类似问题，可以先梳理一下自己服务的目标客户群体，判断其是否聚焦且明确。如果客户群体比较发散，则需求一定无法收敛。\n   Idea：理清业务流程->通过业务流程+调研定位目标客群（聚焦需求）\n2. 大可老师，我一直有点晕，搞不清楚个性化、标准化、产品化这些概念到底有什么关系。\n   Idea：\n   - 个性化：根据用户的偏好和诉求提供差异化服务\n   - 标准化：统一商品的业务流程、统一标准等，提高一致性\n   - 产品化：基于标准化将产品变成可复制的销售的商品\n3. 大可："我们做产品，一定要保证标准版简洁干净。如果什么功能都往上边累加，最后会让系统变得不堪重负，不仅难用，代码维护也会越来越困难。而且对于客户2的情况，既然是个性化十足的大客户，还不如单独做一个定制版，如果有很好的最佳实践，再单独抽出来放进标准版。\n   Idea：做产品的同时要考虑实际使用的感受，一线销售人员对冗杂的功能使用起来成本较高，体验也不会；公司维护系统的成本也很高"\n   标准版要关注高度的可重复性，对于客户提出来的诉求要分析需求在业务流程中是否合理\n4. 一种是表单驱动的设计，一种是模型驱动的设计。对于业态不是特别复杂的产品，可以考虑表单驱动的设计，特点是容易上手，配置简单，缺点是灵活性有限，不能实现更加复杂的诉求。\n   Idea：表单驱动和模型驱动的解释和区别：模型驱动类似于ER图，数据对象是ER建模中的实体\n5. 在业务型产品设计中，有大量的业务逻辑，可以将其提炼总结成一个范式——\'在什么情况下（触发条件），对什么数据做什么处理（业务逻辑）\'，流程引擎就是实现这个逻辑范式的强力组件\n   Idea：步骤：\n   - 定义业务逻辑的触发条件（某个数据被修改、到了某个时间点、用户做了什么动作）\n   - 描述业务逻辑：流程编辑器\n   - 触发后系统的反应是什么？数据的增删改查、发送指令、执行代码等\n   - 专业的流程编辑器具备流程画布交互组件\n\n6. 如果产品本身很轻，客户群体非常聚焦，就没必要做这么重的PaaS底层，通过参数配置就可以支持业务\n   Idea：轻量型产品功能较为简单，注重易用性；客户群体聚焦则需求较为集中，差异性较少->参数配置较为合适，使用PaaS底层反而会造成开发资源浪费\n   PaaS：允许二次开发，提供可编程的底层平台能力，例如：企业微信允许用户基于接口开发适合自己的功能；核心能力：为复杂的业务型产品提供服务，需要投入较多的资源，用户的需求差异性较大\n   参数配置：无需开发即可适配业务需求，提供预设选项供用户选择，例如SaaS的租户配置 核心能力：低成本投入资源较少，用户使用门槛低\n7. 审批流是工作流中的一种，而且相对简单一些。因为审批流是针对一个数据表单的多人协同处理，不涉及复杂场景下的多数据流转问题。不同公司的产品有不同的设计理念，有些会把审批流单独提炼出来作为一个功能，和工作流互相独立，方便管理员理解和使用\n   Idea：关于工作流、审批流和业务流的简单的说明\n8. 功能架构图：\n   Idea：\n   工具型标准化产品\n   ![alt text](image-41.png) - 核心是场景化的解决方案 - 需要完备的功能、丰富的OpenAPI，以及基本的配置、- 满足个性化需求更多在于提供接口\n\n   多租户形态标准化产品\n   ![alt text](image-42.png) - 表单数据+业务流程+约束规则 - 核心遵循MVC模式的三层架构\n   MVC模型简洁：\n\n   非SaaS形态标准化产品\n   ![alt text](image-43.png) - 私有化部署的软件产品一样可以做出标准化产品 - 非SaaS形态的标准化产品具有和其他类型标准化产品相似的架构，无非是去掉了租户管理板块\n\n9. 所谓Open API，即开放的服务接口。接口可以对软件背后的业务能力进行封装，而将封装的业务能力对外暴露，既可以完成系统对接，也可以扩展应用场景和放大业务价值。应用程序的接口抽象与服务化，并不是单纯的技术问题，还可能是业务问题，甚至是商业问题。\n   Idea：一个很场景化解释api接口的连接\n   业务问题：通过接口接入其他业务的app，拓宽业务边界\n   例如：高德的API接入餐饮app\n   商业问题：通过API的调用来收费，API也可以是数据流通的通道将数据价值变现，第三方参与生态建设\n   例如：抖音通过用户互动等api吸引MCN机构加入构建内容生态\n10. 在软件产品的各个模块和组件中，从最死板的硬编码，到最灵活的配置化，有着可遵循的演变路径。不同产品可以根据自身的情况选择不同的轨迹和策略，来逐步完成产品化的建设。\n    Idea：对于资源有限的公司先从死板的编码入手保证功能的完整度和逻辑闭环，经过公司发展和自身生态的发展开展产品化个性建设\n    ![alt text](image-44.png)\n    ![alt text](image-45.png)\n\n## 第九章：\n\n1. B端产品经理的技术知识要求\n   Idea:\n   - 理解一门编程语言\n   - 掌握并使用sql\n   - 具备网络通信等计算机常识\n\n2. 我们提到M公司各个系统已经实现了服务化，因此分销平台的很多功能模块都可以复用现有系统的功能模块，例如分销平台复用了客户主数据系统、Passport系统、支付(Pay)系统、权限管理(Auth)系统、订单中心、仓储服务系统等。\n   Idea：每个实现服务化的系统=积木 接口=积木连接的轴\n3. 研发人员在创建表时，需要给表中的每个字段定义数据类型，例如在表9-1中，ID、ORG_ID和STATUS字段属于数字类型，NAME字段属于字符串类型，CREATETIME字段属于日期类型。\n   Idea：![alt text](image-46.png)\n\n- 关系数据库中，研发人员在创建表中会给每个字段定义数据类型\n  - Id字段：标识每条数据的唯一性，给数据标号\n  - ORG_ID字段：账号对应的组织结构Id\n  - NAME字段：每个账号的名字\n  - STATUS字段：账号的状态\n  - CREATETIME字段：账号创建时间\n    ![alt text](image-47.png)\n  - 组织结构表\n    - ID字段：给组织机构标号，和关系数据库的ORG_ID对应\n    - NAME字段：组织机构名字，sqzx_root是根账号而wg@sqzx.com是子账号\n    - FATHER_NODE_ID字段：父节点的账号，分销总部的FATHER_NODE_ID是-1，证明分销总部是根节点；北京社区之星有限公司的父节点是10001\n    - STATUS字段：状态字段\n    - CREATETIME字段：该组织机构的创建时间\n      ![alt text](image-48.png)\n  - 门店表\n    - ID字段：标识唯一性\n    - ORG_ID字段：对应结构表的Id字段\n    - NAME字段：代表门店的名字。\n    - STATUS字段：代表门店的状态\n    - RECEIVER_ADDRESS字段：代表门店的收货地址\n    - CREATETIME字段：代表该门店的创建时间。\n      ![alt text](image-49.png)\n    - 门店关系表\n      - ID字段：唯一性标识\n      - RECEIVER_STORE_ID字段：门店ID\n      - ASSPORT_ID字段：账号ID\n        ![alt text](image-50.png) ![alt text](image-51.png)\n        SQL多表查询的时候列出组织机构图感觉更直观，可以和Id相关联\n\n## 第十章：\n\n1. 制订制度要在"公司发展到一定规模后"，而不是在"产品研发团队发展到一定规模后"。如果公司发展很快，即便产品研发团队规模很小（如采用了外包方式），面临复杂的业务和爆发式增长的需求，依然需要严格的项目管理制度来规范管理、控制风险。\n   Idea：伴随公司的发展，即使产研团队规模很小也会有多部门协作的情况（财务、人力、市场等），外包合作方增多沟通合作成本变高，需要通过明确制度来规定需求标准、验收的标准和交付流程等，降低信息不对等带来的风险\n2. 软件设计和研发的模式\n   Idea：[瀑布模型 | 敏捷方法之外，有什么更合适的模型吗？]\n   ![alt text](image-52.png)\n   ![alt text](image-53.png)\n3. 测试方式总结\n   Idea：\n   ![alt text](image-54.png)\n4. 通俗来说，强大的执行力和推动力不仅要不忘事，还要上着发条般地追进度、盯过程、要结果。这样虽然可能会让某些合作伙伴暂时产生不舒服感，但只要是为了推动项目，为了要结果，为了产出价值，最终这种积极的态度会得到认可和赞扬。\n   Idea：明确产品价值和收益后积极说服kp推进项目落实，保持强大的执行力，为了结果push进度\n5. 开每日站会：站会是敏捷开发中经典的工作方式。对于软件研发项目，在团队内部开每日站会的确是非常有效的工作机制。\n   Idea：站会相比例会更加随意，时间灵活\n   - 站会时间合适：站会的开始时间不能太早，也不能太晚。\n   - 总结出问题：每日站会可以保证团队快速交流前一天遇到的问题和当天要做的工作，快速识别问题，找出解决方案\n   - 时间短：严格控制时间，不能太长，否则容易降低效率\n\n## 第十一章：\n\n1. 在C端业务领域，不同的运营细分岗位需要具备的能力是相通的，作为一名运营专家，需要同时具备活动运营、用户运营、新媒体运营等经验；但是在B端业务领域，尤其是SaaS领域，市场、销售有完全不同的工作内容，一般从业者都是在某一个方向上深耕，基于长期的职业选择来实践和积累，虽然他们很多时候都被模糊地称为产品运营，但做的是完全不同的工作。\n   Idea：B端和C端产品运营工作的区别：\n   ![alt text](image-55.png)\n   C端用户的行为较为统一，相同的活动运营策略可以模板化套用\n   B端用户的业务差异性较大，运营能力相对垂直化跨行业成本较高\n2. 首先客户结构呈现出经典的销售漏斗结构，然后客户价值又被持续放大，最终呈现出蝴蝶形结构。\n   Idea：\n   销售漏斗结构：\n   ![alt text](image-56.png)\n   蝴蝶结构：\n   ![alt text](image-57.png)\n   - 英文缩写解释:\n     - MDR(Marketing Development Representative)：市场开发代表，一般指市场人员。\n     - SDR(Sales Development Representative)：销售开发代表，一般指线索清洗人员。\n     - AE(Account Executive)：销售人员，一般指电话销售。\n     - FAE(Field Account Executive)：区域销售人员，一般指地面销售。\n     - CSM(Customer Success Manager)：客户成功经理。\n     - MQL(Marketing Qualified Lead)：画像客户，初步未过滤线索。\n     - SQL(Sales Qualified Lead)：意向客户，被核实过的线索。\n     - Opportunity：商机，有实际需求的潜在客户。\n   - 客户消费能力划分：\n     - 小微客户：客单价较低，企业付费能力低，没有专职销售跟进，流程规范化也较低；这类客户一般引导他们自助购买，降低服务成本\n     - 中小客户：客单价中等\n     - 大客户：客单价较高，周期长；更偏向经典的IT项目制销售和管理\n\n3. 绝大多数SaaS公司都采用了拉式营销(Pull Marketing)，尤其是集客式营销(Inbound Marketing)的理念，通过优质内容的持续输出，吸引越来越多的潜在客户持续关注，产生信任，最终自发转化（或者强有力地帮助销售人员培育客户，助攻销售人员完成转化）。这和传统推式营销(Push Marketing)靠主动打广告、上门推销，是完全相反的思路。\n   Idea：\n   - 拉式营销：主要是吸引客户主动前来，比如通过内容营销（抖音）、社交媒体等；决策路径：客户需求→主动搜索→品牌接触→转化\n   - 集客式营销：通过优质内容，打造专业权威形象，吸引目标客户主动留资\n   - 传统推式营销：主动推送信息给潜在客户，比如电视广告、电话销售等；决策路径：品牌曝光→被动接收→需求唤醒→转化\n\n4. 在M公司分销平台的持续迭代优化中，果冻在"分销商城前台"（还记得吗？这是给下单人员使用的H5系统）中设计并上线了独立的四个新功能，并通过第三方埋点软件跟踪了功能上线后的使用情况，得到了四张COHORT留存分析表。表格中的第二列代表每天访问该功能的新用户数，百分比代表在接下来的几天中继续使用功能的新用户占比。\n   ![alt text](image-58.png)\n   Idea：COHORT留存分析介绍',

            '# 需求分析--5W2H\n\n**5H2H是什么？**\n\n- why ：为什么，从老板、需求部门等手上接到一个需求的时候，做的话能够给产品带来哪方面的价值，确定概念。\n- what：做什么，此时就要通过查询资料，竞品分析或者通过自己的理解来确认产品的功能架构图，确定这个需求的形。\n- how：怎么做，这一块我通常喜欢用写论文的思路来思考\n- what这步已经确定了做什么，这其实就是我们的论点，需要补充的是论据和论证，重点梳理所有的功能模块，论据之间不要冗余，有什么联系，这个阶段可以补充原型图和流程图。\n- how much：价值，在设计的时候考虑怎么设计能够给我们带来更多的用户价值或者商业价值。\n- who：谁，不同角色的人用产品的不同角度。\n- when：时间，需求中的限制条件，早上和晚上有什么不同。\n- where：地点，不同的地点有什么影响，比如信号突然没了，或者不同的浏览器打开等等。\n\n**为什么要用5W2H**\n\n- 理解需求，避免理解的偏差\n  "用户说要加个功能"，很可能是个模糊的、带着主观感受的一句话需求。\n  用 5W2H 把 who/when/where/what/why/how/how much 问清楚，才能把 "谁在什么情况下遇到了什么问题" 变成客观、可讨论的事实，而不是凭感觉脑补。\n\n- 区分真伪需求\n  5W2H 里的why（为什么会有这个问题），就是专门帮你挖到需求背后的动机：你要的不是 "深夜走在路边想吃一个烤红薯"，而是 "深夜又冷又饿，想快速解决饥饿 +取暖+ 放松一下"。\n  只有挖到这里，你才不会被用户给的方案绑架，才有空间思考更优解。\n\n- 便于团队理解和落地\n  没做 5W2H 之前，你说 "用户体验不好"，全是主观判断；做完之后，你能说 "20-30 岁的高频用户（who），在 APP 退后台后（where），订单发货时（when），无法收到通知（what），导致 30% 的用户会主动打开 APP 刷新订单（why）"。\n\n**5W2H也不是万能的**\n\n【举个例子】\n\n场景：周末和朋友约着在家聚会，有人提议 "我们点奶茶吧，你定一下"，你会怎么做？\n\n- 常规方法：5W2H\n  - who（什么人）：一起聚会的朋友\n  - when（时间）：周末在家聚会，大家坐着聊天、玩游戏的时候\n  - what（遇到了什么问题）：想喝奶茶，需要有人负责下单\n  - why（为什么会有这个问题）：奶茶好喝又解腻，聚会氛围里大家都想喝点甜的，不想自己操作手机下单\n  - how（怎么解决这个问题）：打开外卖 APP，选个热门奶茶店，点几杯大家爱喝的奶茶\n\n但这样就犯了想当然的错误！\n\n1. 直接执行用户的 "结论"，而非解决根本问题\n\n   朋友说 "点奶茶"，但根本需求不是 "必须喝奶茶"，而是「聚会时想喝点好喝的、放松的饮品」。\n   解决这个问题，是不是冰可乐、气泡水也可以？是不是家里现泡的柠檬茶也能满足？甚至如果有人不爱喝甜的，是不是无糖茶、咖啡也可以？\n\n2. 不了解历史 / 用户调研，忽略隐藏限制\n\n- 有没有人乳糖不耐受？有没有人不爱喝甜的、怕胖？有没有人最近在忌口？\n- 大家平时常喝的品牌 / 口味是什么？之前聚会有没有踩过雷（比如某家店难喝、送得慢）？\n- 聚会里有没有人想喝热饮，有人想喝冰饮？全点奶茶会覆盖不到所有人的需求。\n\n3. 没有竞品 / 替代方案调研除了点外卖奶茶，有没有更合适的选择？\n\n- 小区楼下的便利店买现成饮料，比外卖快还便宜；\n- 自己在家做水果茶、气泡水，更健康也更有参与感；\n- 直接让大家自己点，统一凑单免配送费，比你一个人瞎猜更省心。\n\n4. 没思考是一次性需求还是长期习惯\n\n   这次只是周末一次聚会，但大家平时聚会是不是都有类似需求？如果是经常聚会，"饮品选择" 是需要考虑长期适配的事情，不是每次都靠你临时点奶茶解决。\n\n5. 没调研预算与落地人力大家预算大概多少\n\n   你点的奶茶价格是不是有人觉得贵？配送费、起送价有没有考虑？你自己花时间选店、选品、凑单，会不会耽误聚会聊天的时间？\n\n6. 没思考优先级与价值你现在有没有更重要的事？\n\n   比如布置场地、准备游戏、收拾桌面，这些事比纠结喝什么更影响聚会体验？点奶茶这件事，能满足多少人的需求？投入的时间和大家的满意度，是不是成正比？\n\n**所以除了5W2H以外，我们还需要做额外的自查**\n\n- 是否被诱导在执行用户给出的 "解决方案结论"？是否是伪需求？\n- 用户调研 / 竞品分析做了么？有没有更省事、更贴合大家需求的替代方案？\n- 历史数据整理是什么样的？以往的流程和方法是什么？\n- 是一次性的偶发事件还是长期习惯？\n- ROI 投入回报比（时间、精力、金钱）合理？和当下更影响体验的事比，这件事值不值得花这么多精力？\n- 优先级合理性？',

            '## 机器学习\n\n**机器学习 = 让机器从数据里找规律、做预测\n\n传统机器学习（浅层学习）= 人帮机器把 "关键信息（特征）" 找好，机器再根据这些信息做判断，不会自己提炼特征。**\n\n举个例子：你给机器看 100 张猫和狗的照片，它自己学会了 "猫的尖耳朵 + 三角脸" 这个规律，之后看到新照片，就能判断这是猫还是狗。\n\n传统的机器学习：要判断照片里的猫，得先由人手动提取 "耳朵形状、脸的轮廓、毛发颜色" 这些特征，再根据人类已经输入的"尖耳朵+三角脸=猫"判断这个为猫\n\n**特征\n\n定义：特征，就是你用来判断一件事的「关键信息 / 线索」。它是模型做预测时，唯一能看到、能用来分析的 "素材"。\n\n形式：\n- 连续数值特征：能大小排序的数字，例如：奶茶的甜度、顾客的年龄\n- 离散的符号特征：分类、标签类的信息，例如：顾客的性别，颜色**\n\n举个例子：调奶茶的 AI\n\n我们的目标是：根据顾客的描述，推荐合适的甜度。\n\n这里的特征，就是顾客说的这些信息：顾客的描述文本："怕胖，不爱甜，怕腻"\n\n（如果细化成数值，还可以拆成）顾客的年龄、过往订单的平均甜度、是否点过无糖款这些就是 AI 用来判断 "给几分糖" 的所有依据，也就是特征。',

            '# 有监督学习&无监督学习\n\n## 有监督学习\n\n有监督学习（Supervised Learning）：是机器学习中一种常见的学习范式，其基本思想是利用带有标签的训练数据来训练模型，从而使其能够从输入数据中学习到输入与输出之间的映射关系，然后可以利用这个映射关系对新的未标签数据进行预测。\n\n1. 翻译：有监督学习，就像带标准答案刷题的学习方式：\n   a. 给模型的训练数据，是 "题目 + 标准答案" 的组合（带标签的数据）。\n   b. 模型在反复刷题的过程中，会自己总结出 "题目→答案" 的规律（输入与输出的映射关系）。\n   c. 等它学透了规律，遇到没见过的新题目，就能自己写出答案了。\n\n🌰先准备「带答案的练习题」（带标签的训练数据）你给 AI 看 100 份 "顾客订单 + 好评反馈" 的记录：\n\n- 输入（特征 / 题目）：顾客说 "我怕胖，不爱甜"\n- 输出（标签 / 标准答案）：调 3 分糖，顾客好评\n- 输入（特征 / 题目）：顾客说 "我超爱喝甜的"\n- 输出（标签 / 标准答案）：调全糖，顾客好评这些 "订单 + 好评结果"，就是 AI 的训练数据，每一条都有明确的 "正确答案"。\n\nAI「刷题学习」，找规律：AI 反复看这些数据，慢慢摸出规律："怕胖 / 不爱甜" → 低分糖"爱喝甜的 / 喜欢甜口" → 高分糖这个 "顾客描述→甜度" 的对应关系，就是 AI 学到的输入到输出的映射。\n\n遇到新顾客，AI 自己做预测来了个新顾客说："我想喝不太甜的，清爽一点的"，AI 根据之前学的规律，自动判断："这属于不爱甜的类型，调3分糖！"这就是用学到的规律，对 "没见过的新数据" 做预测。\n\n2. 应用：\n\n- 分类（Classification）：预测输入样本属于哪个类别或者类别的概率分布。\n- 回归：预测输入样本的数值输出，通常是连续的实数值。\n- 目标检测：在图像或者视频中检测出目标物体的位置和类别。\n- 序列生成：根据输入的序列生成输出的序列\n- 序列标注：序列标注是一种常见的机器学习任务，其中输入数据通常是序列数据，例如文本、语音、生物信息学等。有监督学习可以对输入的序列中的每个元素进行标签预测，如命名实体识别（NER，指自然语言处理中，能从文本中提取如人名、地名、组织名、日期、时间、金额等具有特定意义的实体或实体类别）、语音识别等。\n\n分别来举个🌰\n\n- 分类（Classification）：给东西 "打标签、分类型"，输出是离散的类别 / 选项。垃圾邮件分类 → 收到一封邮件，模型判断它是「正常邮件」还是「垃圾邮件」\n- 回归：预测一个连续的数字，而不是分类。房价预测 → 输入房子的面积、地段、楼层，模型预测 "这套房子值 320 万。和分类最大的区别是，回归的结果是 "一个具体的数"，而不是选项。\n- 目标检测：不仅要告诉你 "这是什么"，还要告诉你 "它在哪里"。自动驾驶 → 摄像头拍下路面，模型标出 "这里有一辆车（框出位置）、那里有个行人（框出位置）、前方有红绿灯（框出位置）"相当于 "分类 + 定位" 的组合任务，比单纯的图像分类多了找位置的能力。\n- 序列生成：输入一串数据，模型输出另一串数据，而且输入和输出都是 "按顺序排列的"。输入和输出都是 "序列"，模型要学习的是序列和序列之间的对应关系。机器翻译 → 写作文 / 自动续写→输入序列（开头）：今天天气很好，我和朋友一起去→模型学到的规律：句子的逻辑、词语搭配、常见的续写方式。→输出序列（续写的全文）：今天天气很好，我和朋友一起去了公园放风筝，风很舒服，玩得很开心。\n- 序列标注：给 "一串数据里的每个小部分" 单独打标签，重点是给序列里的每个元素分类。命名实体识别（NER） → 输入一句话 "张三明天去北京出差"，模型给每个词打标签：「张三（人名）」「明天（时间）」「北京（地名）」\n\n## 无监督学习\n\n无监督学习（Unsupervised Learning）是机器学习中一种常见的学习范式，其目标是从未标记的数据中自动地发现数据中的结构、模式、关联或者表示，而无需使用人工标签或者先验知识的指导。\n\n1. 翻译：无监督学习是 "没有答案、全靠自己找规律" 的学习方式，给模型的数据，只有题干（输入 / 特征），没有标准答案（标签 / 输出）。模型的任务不是 "学会做题"，而是自己在一堆数据里，把相似的东西聚在一起、找出隐藏的规律或分组。\n\n🌰整理通讯录：你把通讯录里几百个联系人丢给 AI，不标 "家人、同事、朋友"，让无监督学习的它自己分组\n\n- AI 只能根据通话频率、备注关键词、互动时间这些特征，自己找规律。\n- 它会发现：每天晚上都联系的是一类；只在工作日白天联系的是一类；逢年过节联系的是一类。\n- 这个也是典型的无监督学习。\n  有监督学习：\n- 准备训练数据（带标签的）你先手动给 100 个联系人分好组，给 AI 做 "标准答案"：\n  ![alt text](image-73.png)\n  AI 学习的过程AI会对照这些 "输入（通话特征）+ 输出（分组标签）"，自己学出规律：\n- 每天晚上联系 + 备注亲昵称呼 → 家人\n- 工作日白天联系 + 备注带 "总 / 经理" → 同事\n  预测新联系人来了个新联系人，备注 "李姐"，通话时间都是工作日下午。AI 根据学到的规律，直接判断：「同事」。\n\n2. 应用：\n\n- 聚类：将数据集中的样本根据相似性进行自动分类，形成不同的簇。\n- 异常检测：识别数据中的异常样本，这些样本与正常样本不同，可能是潜在的异常事件或异常行为。\n- 降维：将高维数据映射到低维空间，保留数据的主要信息，去除冗余和噪音。\n- 关联规则挖掘：从大规模数据集中发现频繁出现的关联规则，用于发现数据中的潜在关联关系。\n- 聚类：把 "长得像" 的数据，自动凑成一堆一堆的，完全不用你提前给标签，但这一堆一堆的命名需要自己来命。核心：自动分堆，不告诉你每堆叫什么，需要你事后解读。\n\n🌰 顾客分群：电商平台把消费习惯相似的用户分成几类，比如 "经常买母婴用品的宝妈""喜欢买潮牌的年轻人"，方便针对性营销。\n\n- 异常检测；核心：找 "不一样的"，不关心正常的，只揪出异常行为。 信用卡欺诈检测：你平时每月只花 3000 块，突然一笔刷了 10 万，系统就会把这笔标记为异常，提醒你 "是不是被盗刷了？"\n- 降维：就是给数据 "瘦身"，把复杂的、信息太多的数据，压缩成更简单的版本，同时保留关键信息。\n- 关联规则挖掘：核心：找数据里的 "隐藏搭档"，发现事物之间的关联关系。🌰 购物篮分析：超市发现买尿布的人，经常会顺便买啤酒，就把这两个商品放在一起，方便顾客购买。\n\n## Tik tok的推荐算法\n\n抖音的推荐算法，是无监督 + 有监督学习一起用的混合系统。\n无监督学习：先给视频自动分堆、打隐形标签，把相似内容凑在一起。\n有监督学习：根据你的点赞、划走等行为，学你喜欢哪一堆的内容，再给你精准推送。\n\n### 无监督学习部分\n\n1. 核心：从无标记数据里学用户行为和内容特征，靠聚类、降维给视频打标签、凑相似堆。\n\n2. 步骤：\n\n- 给视频打上隐性标签：用降维、特征提取这些无监督方法，自动给视频提炼关键特征\n- 把相似的视频凑成堆：有了视频的特征后，再用无监督的聚类，把 "长得像" 的视频聚成一堆\n- 推荐相似内容：看完视频后根据标签推荐相似商品\n\n### 有监督学习\n\n1. 核心：用用户的历史行为（点赞、评论、点击）这些 "带标签的数据"，训练模型预测你喜欢什么。\n\n2. 步骤：\n\n- 用户的互动数据喂给模型"标准答案和特征标签"\n- 算法利用这些数据学你喜欢什么的规律\n- 做精准预测\n- 点赞、评论、看完视频 = 告诉算法："我喜欢这类内容"（正标签）\n- 你给 10 条猫咪视频点了赞，给 10 条汽车视频划走了，模型就学到了："你大概率喜欢猫咪内容，不喜欢汽车内容。"\n- 模型就能预测："你大概率会喜欢这个猫咪视频，给你推；你大概率不喜欢这个汽车视频，不推。"',

          let line = lines[i];

          if (!line || !line.trim()) {
            finalHtml += "<br>";
            continue;
          }

          if (
            line.startsWith("<h") ||
            line.startsWith("<pre") ||
            line.startsWith("</") ||
            line.startsWith("<blockquote") ||
            line.startsWith("<img")
          ) {
            finalHtml += line;
            continue;
          }

          let orderedMatch = line.trim().match(/^(\d+)\. (.*)/);
          if (orderedMatch) {
            let num = orderedMatch[1];
            let content = orderedMatch[2];
            finalHtml += `<div class="mb-2"><span class="font-bold mr-2 text-pink-700">${num}.</span><span>${content}</span></div>`;
            continue;
          }

          let unorderedMatch = line.trim().match(/^[-*+] (.*)/);
          if (unorderedMatch) {
            let content = unorderedMatch[1];
            finalHtml += `<div class="flex items-start mb-2"><span class="text-pink-500 mr-2 mt-1">•</span><span>${content}</span></div>`;
            continue;
          }

          if (
            line.startsWith("   Idea") ||
            line.startsWith("    Idea") ||
            line.startsWith("   Q:") ||
            line.startsWith("    Q:")
          ) {
            let indent = line.startsWith("    ") ? 4 : 3;
            let content = line.substring(indent);
            finalHtml += `<div class="ml-8 text-pink-800 italic mb-1">${content}</div>`;
            continue;
          }

          if (line.startsWith("   ") || line.startsWith("    ")) {
            let indent = line.startsWith("    ") ? 4 : 3;
            let content = line.substring(indent);
            finalHtml += `<div class="ml-8 text-pink-800 mb-1">${content}</div>`;
            continue;
          }

          finalHtml += `<p>${line}</p>`;
        }

        return finalHtml;
      }

      function getCurrentArticleId() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");
        return id ? parseInt(id) : 1;
      }

      function loadArticle(articleId) {
        const article = articles.find((a) => a.id === articleId);
        if (!article) return;

        document.getElementById("article-tag").textContent = article.tag;
        document.getElementById("article-date").textContent = article.date;
        document.getElementById("article-readtime").textContent =
          article.readtime;
        document.getElementById("article-title").textContent = article.title;
        document.getElementById("article-content").innerHTML = renderMarkdown(
          article.content,
        );

        const prevArticle = article.prev
          ? articles.find((a) => a.id === article.prev)
          : null;
        if (prevArticle) {
          document.getElementById("prev-title").textContent = prevArticle.title;
          document.getElementById("prev-article").href =
            "?id=" + prevArticle.id;
          document.getElementById("prev-article").style.display = "";
        } else {
          document.getElementById("prev-article").style.display = "none";
        }

        const nextArticle = article.next
          ? articles.find((a) => a.id === article.next)
          : null;
        if (nextArticle) {
          document.getElementById("next-title").textContent = nextArticle.title;
          document.getElementById("next-article").href =
            "?id=" + nextArticle.id;
          document.getElementById("next-article").style.display = "";
        } else {
          document.getElementById("next-article").style.display = "none";
        }
      }

      // ==================== AI速览功能开始 ====================

      // API Key 配置位置（请在此处填入你的阿里云百炼API Key）
      const API_KEY = "sk-9e05471b3ae442f2b99d72daa84edbbe";

      // AI速览模块状态管理
      let aiSummaryExpanded = false; // 是否已展开
      let currentArticleId = null; // 当前文章ID

      // 获取当前文章的纯文本内容（去除HTML标签，用于API调用）
      function getArticlePlainText(articleContent) {
        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = renderMarkdown(articleContent);
        return tempDiv.textContent || tempDiv.innerText || "";
      }

      // 流式输出：逐字显示效果
      function streamSummaryContent(text) {
        const summaryDiv = document.getElementById("ai-summary-text");
        summaryDiv.innerHTML = "";

        // 清理内容
        let cleanedText = text
          .replace(/^\d+[、.]\s*/gm, "")
          .replace(/\*\*([^*]+)\*\*/g, "$1")
          .replace(/\*([^*]+)\*/g, "$1")
          .replace(/`([^`]+)`/g, "$1")
          .trim();

        const paragraph = document.createElement("p");
        paragraph.className = "mb-3 last:mb-0";
        summaryDiv.appendChild(paragraph);

        let index = 0;
        const speed = 30; // 打字速度（毫秒）

        const typeInterval = setInterval(() => {
          if (index < cleanedText.length) {
            paragraph.textContent += cleanedText[index];
            index++;
          } else {
            clearInterval(typeInterval);
          }
        }, speed);
      }

      // 追加流式内容
      function appendStreamContent(chunk) {
        const summaryDiv = document.getElementById("ai-summary-text");
        let paragraph = summaryDiv.querySelector("p");

        if (!paragraph) {
          paragraph = document.createElement("p");
          paragraph.className = "mb-3 last:mb-0";
          summaryDiv.appendChild(paragraph);
        }

        // 清理chunk中的标记
        let cleanedChunk = chunk
          .replace(/\*\*([^*]+)\*\*/g, "$1")
          .replace(/\*([^*]+)\*/g, "$1")
          .replace(/`([^`]+)`/g, "$1");

        paragraph.textContent += cleanedChunk;
      }

      // 显示加载状态
      function showLoadingState() {
        console.log("[AI速览] 显示加载状态");
        document
          .getElementById("ai-summary-loading")
          .classList.remove("hidden");
        document.getElementById("ai-summary-error").classList.add("hidden");
        document.getElementById("ai-summary-text").innerHTML = "";
      }

      // 显示错误状态
      function showErrorState(customMessage) {
        console.log("[AI速览] 显示错误状态");
        document.getElementById("ai-summary-loading").classList.add("hidden");
        document.getElementById("ai-summary-error").classList.remove("hidden");
        document.getElementById("ai-summary-text").innerHTML = "";

        // 如果有自定义消息，显示它，否则显示默认消息
        const errorMessageElement = document.getElementById(
          "ai-summary-error-message",
        );
        if (customMessage) {
          errorMessageElement.textContent = "⚠️ " + customMessage;
        } else {
          errorMessageElement.textContent = "⚠️ 生成失败，请稍后重试";
        }
      }

      // 显示摘要内容（流式输出）
      function showSummaryState(summaryText) {
        console.log("[AI速览] 显示摘要内容");
        document.getElementById("ai-summary-loading").classList.add("hidden");
        document.getElementById("ai-summary-error").classList.add("hidden");
        streamSummaryContent(summaryText);
      }

      // 调用阿里云百炼API生成摘要（流式输出）
      async function generateAiSummary(articleContent) {
        console.log(
          "[AI速览] ============= 开始调用阿里云百炼API（流式）=============",
        );
        console.log("[AI速览] 文章内容长度:", articleContent.length, "字符");

        if (!API_KEY || API_KEY.includes("这里留空")) {
          console.log("[AI速览] API Key未配置");
          showSummaryState(
            "请在代码中配置API_KEY后使用AI速览功能。\n在detail.html中找到 const API_KEY 这一行，填入你的阿里云百炼API Key即可。",
          );
          return;
        }

        showLoadingState();

        try {
          const apiUrl =
            "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";
          const modelName = "qwen-turbo";

          console.log("[AI速览] 请求地址:", apiUrl);
          console.log("[AI速览] 使用模型:", modelName);
          console.log("[AI速览] 启用流式输出");

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${API_KEY}`,
            },
            body: JSON.stringify({
              model: modelName,
              messages: [
                {
                  role: "system",
                  content:
                    "你是一个文章速览助手。你的任务是通读用户提供的完整文章（包括所有章节），然后用200字以内的简洁中文概括全文核心内容。必须用纯文本段落形式输出，禁止使用Markdown格式、序号、加粗、星号。不要输出任何与文章内容无关的统计数字。",
                },
                {
                  role: "user",
                  content:
                    "请通读以下整篇文章的全部内容（从头到尾所有章节），然后用一段简洁的纯文本概括全文核心观点，控制在200字以内：\n\n" +
                    articleContent,
                },
              ],
              temperature: 0.5,
              max_tokens: 400,
              stream: true, // 启用流式输出
            }),
          });

          console.log("[AI速览] 收到响应，状态码:", response.status);

          if (!response.ok) {
            const errorText = await response.text();
            console.error("[AI速览] API请求失败，响应内容:", errorText);

            if (response.status === 401) {
              throw new Error("API Key无效，请检查配置");
            } else if (response.status === 429) {
              throw new Error("请求过于频繁，请稍后再试");
            } else {
              throw new Error("API请求失败，状态码: " + response.status);
            }
          }

          // 处理流式响应
          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");

          // 隐藏加载状态，准备显示流式内容
          document.getElementById("ai-summary-loading").classList.add("hidden");
          document.getElementById("ai-summary-error").classList.add("hidden");
          document.getElementById("ai-summary-text").innerHTML = "";

          console.log("[AI速览] 开始接收流式数据...");

          while (true) {
            const { done, value } = await reader.read();

            if (done) {
              console.log("[AI速览] ============= 流式传输完成 =============");
              break;
            }

            const chunk = decoder.decode(value, { stream: true });
            const lines = chunk.split("\n").filter((line) => line.trim());

            for (const line of lines) {
              if (line.startsWith("data: ")) {
                const data = line.slice(5);

                if (data === "[DONE]") {
                  console.log("[AI速览] 收到结束标记");
                  return;
                }

                try {
                  const json = JSON.parse(data);
                  const content = json.choices?.[0]?.delta?.content;

                  if (content) {
                    console.log("[AI速览] 收到内容块:", content);
                    appendStreamContent(content);
                  }
                } catch (e) {
                  console.warn("[AI速览] 解析JSON失败:", e);
                }
              }
            }
          }
        } catch (error) {
          console.error("[AI速览] ============= 生成失败 =============");
          console.error("[AI速览] 完整错误对象:", error);
          console.error("[AI速览] 错误信息:", error.message);
          console.error("[AI速览] 错误堆栈:", error.stack);

          if (error.message.includes("API Key无效")) {
            showErrorState("API Key无效，请检查配置");
          } else if (error.message.includes("请求过于频繁")) {
            showErrorState("请求过于频繁，请稍后再试");
          } else {
            showErrorState();
          }
        }
      }

      // 展开/收起AI速览
      function toggleAiSummary() {
        aiSummaryExpanded = !aiSummaryExpanded;
        const contentDiv = document.getElementById("ai-summary-content");
        const chevronDown = document.getElementById("ai-summary-chevron-down");
        const chevronUp = document.getElementById("ai-summary-chevron-up");
        const headerDiv = document.getElementById("ai-summary-header");

        if (aiSummaryExpanded) {
          headerDiv.style.borderRadius = "8px 8px 0 0";
          contentDiv.classList.remove("hidden");
          chevronDown.classList.add("hidden");
          chevronUp.classList.remove("hidden");

          const article = articles.find((a) => a.id === currentArticleId);
          if (article) {
            const plainText = getArticlePlainText(article.content);
            generateAiSummary(plainText);
          }
        } else {
          headerDiv.style.borderRadius = "8px";
          contentDiv.classList.add("hidden");
          chevronUp.classList.add("hidden");
          chevronDown.classList.remove("hidden");
        }
      }

      // 刷新AI速览（重新生成）
      async function refreshAiSummary() {
        const article = articles.find((a) => a.id === currentArticleId);
        if (article) {
          const plainText = getArticlePlainText(article.content);
          await generateAiSummary(plainText);
        }
      }

      // ==================== AI速览功能结束 ====================

      document.addEventListener("DOMContentLoaded", function () {
        const articleId = getCurrentArticleId();
        currentArticleId = articleId;
        loadArticle(articleId);
      });
    </script>
  </body>
</html>
