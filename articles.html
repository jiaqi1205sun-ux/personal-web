<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全部文章 | 我的产品之旅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+KuaiLe&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pink: {
                50: "#FDF2F8",
                100: "#FCE7F3",
                200: "#FBCFE8",
                300: "#F9A8D4",
                400: "#F472B6",
                500: "#EC4899",
                600: "#DB2777",
                700: "#BE185D",
                800: "#9D174D",
                900: "#831843",
              },
            },
            fontFamily: {
              pixel: ['"Press Start 2P"', '"ZCOOL KuaiLe"', "cursive"],
              zhPixel: ['"ZCOOL KuaiLe"', '"Press Start 2P"', "cursive"],
              sans: ['"Noto Sans SC"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Noto Sans SC", sans-serif;
        background-color: #fdf2f8;
        color: #831843;
        scroll-behavior: smooth;
        image-rendering: pixelated;
      }

      .font-pixel {
        font-family: "Press Start 2P", "ZCOOL KuaiLe", cursive;
      }
      .font-zh-pixel {
        font-family: "ZCOOL KuaiLe", "Press Start 2P", cursive;
      }

      .pixel-card {
        background: white;
        border: 4px solid #831843;
        box-shadow: 6px 6px 0px 0px #ec4899;
        transition: all 0.2s ease;
        image-rendering: pixelated;
      }
      .pixel-card:hover {
        transform: translate(-3px, -3px);
        box-shadow: 9px 9px 0px 0px #f472b6;
      }

      .pixel-tag {
        display: inline-block;
        background: #fbcfe8;
        color: #be185d;
        border: 2px solid #be185d;
        padding: 4px 12px;
        font-size: 0.75rem;
        font-weight: 700;
        image-rendering: pixelated;
        box-shadow: 2px 2px 0px 0px #be185d;
      }

      .pixel-btn {
        position: relative;
        display: inline-block;
        background: #ec4899;
        color: white;
        border: none;
        cursor: pointer;
        image-rendering: pixelated;
        transition: transform 0.1s;
        box-shadow:
          inset -4px -4px 0px 0px rgba(0, 0, 0, 0.2),
          4px 4px 0px 0px #831843;
      }
      .pixel-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow:
          inset -4px -4px 0px 0px rgba(0, 0, 0, 0.2),
          6px 6px 0px 0px #831843;
      }
      .pixel-btn:active {
        transform: translate(2px, 2px);
        box-shadow:
          inset -4px -4px 0px 0px rgba(0, 0, 0, 0.2),
          2px 2px 0px 0px #831843;
      }

      .pixel-btn-outline {
        position: relative;
        display: inline-block;
        background: transparent;
        color: #ec4899;
        border: 4px solid #ec4899;
        cursor: pointer;
        image-rendering: pixelated;
        transition: transform 0.1s;
        box-shadow: 4px 4px 0px 0px #ec4899;
      }
      .pixel-btn-outline:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px 0px #ec4899;
        background: rgba(236, 72, 153, 0.1);
      }
      .pixel-btn-outline:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px 0px #ec4899;
      }

      .pixel-nav {
        background: #fdf2f8;
        border-bottom: 4px solid #831843;
        image-rendering: pixelated;
      }

      .pixel-menu {
        background: #fdf2f8;
        border: 4px solid #831843;
        box-shadow: 6px 6px 0px 0px #ec4899;
      }

      .pixel-box {
        background: white;
        border: 3px solid #831843;
        box-shadow: 4px 4px 0px 0px #ec4899;
        padding: 16px;
      }

      .pixel-divider {
        height: 8px;
        background: repeating-linear-gradient(
          90deg,
          #ec4899 0px,
          #ec4899 8px,
          transparent 8px,
          transparent 16px
        );
      }

      .pixel-bg {
        background-image:
          radial-gradient(circle, #f9a8d4 2px, transparent 2px),
          radial-gradient(circle, #fbcfe8 2px, transparent 2px);
        background-size: 32px 32px;
        background-position:
          0 0,
          16px 16px;
      }

      .fade-in {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.8s ease,
          transform 0.8s ease;
      }
      .fade-in.visible {
        opacity: 1;
        transform: translateY(0);
      }

      ::-webkit-scrollbar {
        width: 12px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf2f8;
        border-left: 3px solid #831843;
      }
      ::-webkit-scrollbar-thumb {
        background: #ec4899;
        border: 3px solid #831843;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f472b6;
      }

      .sidebar-wrapper {
        width: 220px;
        flex-shrink: 0;
        height: fit-content;
      }

      .sidebar {
        background: white;
        border: 4px solid #831843;
        box-shadow: 6px 6px 0px 0px #ec4899;
        padding: 20px;
        position: sticky;
        top: 2rem;
        max-height: calc(100vh - 4rem);
        overflow-y: auto;
      }

      .sidebar::-webkit-scrollbar {
        width: 8px;
      }
      .sidebar::-webkit-scrollbar-track {
        background: #fdf2f8;
        border-left: 2px solid #831843;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: #ec4899;
        border: 2px solid #831843;
      }
      .sidebar::-webkit-scrollbar-thumb:hover {
        background: #f472b6;
      }

      .sidebar-title {
        font-family: "ZCOOL KuaiLe", "Press Start 2P", cursive;
        font-size: 1.25rem;
        font-weight: 700;
        color: #831843;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px dashed #ec4899;
      }

      .category-item {
        display: block;
        padding: 10px 14px;
        margin-bottom: 8px;
        color: #831843;
        font-weight: 600;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.2s ease;
        border-radius: 0;
      }

      .category-item:hover {
        background: #fbcfe8;
        border-color: #be185d;
      }

      .category-item.active {
        background: #ec4899;
        color: white;
        border-color: #831843;
        box-shadow: 3px 3px 0px 0px #831843;
      }

      .article-card {
        background: white;
        border: 4px solid #831843;
        box-shadow: 6px 6px 0px 0px #ec4899;
        padding: 20px;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .article-card:hover {
        transform: translate(-3px, -3px);
        box-shadow: 9px 9px 0px 0px #f472b6;
      }

      .article-card-title {
        font-family: "ZCOOL KuaiLe", "Press Start 2P", cursive;
        font-size: 1.1rem;
        font-weight: 700;
        color: #831843;
        margin-bottom: 12px;
        line-height: 1.4;
      }

      .article-card-summary {
        color: #9d174d;
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: 16px;
      }

      .article-card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .article-card-date {
        color: #be185d;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .mobile-tabs {
        display: none;
        overflow-x: auto;
        white-space: nowrap;
        padding: 12px 0;
        border-bottom: 4px solid #831843;
        background: white;
        margin-bottom: 20px;
      }

      .mobile-tab {
        display: inline-block;
        padding: 8px 16px;
        margin-right: 8px;
        border: 2px solid #831843;
        background: white;
        color: #831843;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .mobile-tab:hover {
        background: #fbcfe8;
      }

      .mobile-tab.active {
        background: #ec4899;
        color: white;
        border-color: #831843;
        box-shadow: 3px 3px 0px 0px #831843;
      }

      @media (max-width: 1024px) {
        .sidebar-wrapper {
          width: 180px;
        }
      }

      @media (max-width: 768px) {
        .sidebar-wrapper {
          display: none;
        }
        .mobile-tabs {
          display: block;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <div class="max-w-6xl mx-auto px-6">
      <section class="py-8">
        <div class="mb-8 fade-in">
          <a
            href="index.html"
            class="pixel-btn-outline px-6 py-2 font-bold text-sm inline-flex items-center gap-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
            返回首页
          </a>
        </div>
      </section>

      <section class="pb-20">
        <div class="mb-8 fade-in">
          <h1
            class="font-zh-pixel text-2xl md:text-3xl font-bold text-pink-900 mb-3"
          >
            全部文章
          </h1>
          <div class="pixel-divider w-32"></div>
        </div>

        <div class="mobile-tabs fade-in" id="mobileTabs">
          <div class="mobile-tab active" data-category="all">全部</div>
          <div class="mobile-tab" data-category="产品认知">产品认知</div>
          <div class="mobile-tab" data-category="日常积累">日常积累</div>
          <div class="mobile-tab" data-category="AI">AI</div>
          <div class="mobile-tab" data-category="my life">my life</div>
        </div>

        <div class="flex gap-8 fade-in">
          <div class="sidebar-wrapper hidden md:block">
            <div class="sidebar">
              <h3 class="sidebar-title">文章分类</h3>
              <div class="category-item active" data-category="all">全部</div>
              <div class="category-item" data-category="产品认知">产品认知</div>
              <div class="category-item" data-category="日常积累">日常积累</div>
              <div class="category-item" data-category="AI">AI</div>
              <div class="category-item" data-category="my life">my life</div>
            </div>
          </div>

          <div class="flex-1">
            <div
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
              id="articleGrid"
            ></div>
          </div>
        </div>
      </section>
    </div>

    <!-- 页脚 - 与首页完全一致 -->
    <footer class="py-8 bg-pink-900 text-pink-300 border-t-4 border-pink-500">
      <div
        class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <p class="text-sm font-bold">
          2026 我的产品之旅 · 用 Lucide 图标和 Claude Code 构建
        </p>
        <div class="flex gap-6 text-sm font-bold">
          <a
            href="index_pixel.html#projects"
            class="hover:text-white transition-colors border-b-2 border-transparent hover:border-white"
          >
            项目
          </a>
          <a
            href="index_pixel.html#awards"
            class="hover:text-white transition-colors border-b-2 border-transparent hover:border-white"
          >
            奖项
          </a>
          <a
            href="articles.html"
            class="hover:text-white transition-colors border-b-2 border-transparent hover:border-white"
          >
            文章
          </a>
          <a
            href="index_pixel.html#about"
            class="hover:text-white transition-colors border-b-2 border-transparent hover:border-white"
          >
            关于
          </a>
        </div>
      </div>
    </footer>

    <script>
      const observerOptions = {
        threshold: 0.1,
        rootMargin: "0px 0px -50px 0px",
      };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, observerOptions);

      document.querySelectorAll(".fade-in").forEach((el) => {
        observer.observe(el);
      });

      const articles = [
        {
          id: 1,
          category: "产品认知",
          title: "《俞军产品方法论》读书笔记",
          summary:
            "学习《俞军产品方法论》的笔记整理，包含用户模型、交易模型、产品经理成长等核心内容。",
          date: "2024.12",
        },
        {
          id: 18,
          category: "产品认知",
          title: "《决胜B端》Idea笔记",
          summary:
            "学习《决胜B端》的笔记整理，包含B端产品定义、业务流程、竞品分析、数据建模等核心内容。",
          date: "2025.04",
        },
        {
          id: 19,
          category: "产品认知",
          title: "需求分析--5W2H",
          summary:
            "5W2H需求分析方法详解，包括why、what、how、how much、who、when、where七大维度，以及使用场景和局限性分析。",
          date: "2025.06",
        },
        {
          id: 20,
          category: "AI",
          title: "机器学习",
          summary:
            "机器学习基础概念讲解，包括机器学习定义、传统机器学习与深度学习的区别，以及特征的概念和分类。",
          date: "2026.03",
        },
        {
          id: 21,
          category: "AI",
          title: "有监督学习&无监督学习",
          summary:
            "详细讲解有监督学习和无监督学习的区别、应用场景，以及它们在抖音推荐算法中的实际应用。",
          date: "2026.04",
        },
      ];

      let currentCategory = "all";

      function renderArticleCard(article) {
        return `
          <a href="detail.html?id=${article.id}" class="article-card block hover:no-underline">
            <h3 class="article-card-title">${article.title}</h3>
            <p class="article-card-summary">${article.summary}</p>
            <div class="article-card-meta">
              <span class="pixel-tag text-xs">${article.category}</span>
              <span class="article-card-date">${article.date}</span>
            </div>
          </a>
        `;
      }

      function renderArticles(category) {
        const grid = document.getElementById("articleGrid");
        const filteredArticles =
          category === "all"
            ? articles
            : articles.filter((article) => article.category === category);

        grid.innerHTML = filteredArticles.map(renderArticleCard).join("");
      }

      function setActiveCategory(category) {
        currentCategory = category;

        document.querySelectorAll(".category-item").forEach((item) => {
          item.classList.remove("active");
          if (item.dataset.category === category) {
            item.classList.add("active");
          }
        });

        document.querySelectorAll(".mobile-tab").forEach((tab) => {
          tab.classList.remove("active");
          if (tab.dataset.category === category) {
            tab.classList.add("active");
          }
        });

        renderArticles(category);
      }

      document.querySelectorAll(".category-item").forEach((item) => {
        item.addEventListener("click", () => {
          setActiveCategory(item.dataset.category);
        });
      });

      document.querySelectorAll(".mobile-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          setActiveCategory(tab.dataset.category);
        });
      });

      document.addEventListener("DOMContentLoaded", () => {
        renderArticles("all");
      });
    </script>
  </body>
</html>
